<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stellar Hierarchy Construct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* LCARS design tokens. Mirrored in JS as LCARS_PALETTE, which is the
       actual source of truth — it pushes these same values in here via
       setProperty() at startup, and reuses them for the 3D scene (selection
       highlight, object-type accents) so the chrome and the construct itself
       read as one consistent color system instead of two coincidentally-
       similar palettes. The literals below are just the pre-JS fallback. */
    :root {
      --lcars-butterscotch: #ff9c00;
      --lcars-african-violet: #cc99cc;
      --lcars-periwinkle: #9999ff;
      --lcars-gold: #ffcc66;
      --lcars-mars: #ff6666;
      --lcars-ice: #66ccff;
      --lcars-salmon: #ff9977;
      --lcars-plum: #cc6699;
      --lcars-alert: #33ffff;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: monospace;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      /* Hand every touch gesture (drag-orbit, pinch-zoom) to OrbitControls
         instead of letting the browser scroll/zoom the page with it. */
      touch-action: none;
    }
    /* --- LCARS Corner Panels --- */
    /* Four independent, independently-collapsible panels, one per screen
       corner, instead of one mega-panel with tabs inside it — Objects
       (upper-left), Appearance (lower-left), Camera (upper-right), Files
       (lower-right). Each is just a flat colored header (always visible —
       that's the whole discovery mechanism now, no hidden summon gesture)
       over a collapsible body. The swept, LCARS-signature corner rounds
       toward screen center on every one; the two screen edges it touches
       stay sharp. No blur, no gradients, no drop shadows: LCARS was flat
       design before "flat design" had a name. */
    .lcars-corner-panel {
      position: fixed;
      width: 296px;
      max-height: calc(50vh - 30px);
      display: flex;
      flex-direction: column;
      font-family: 'Antonio', 'Arial Narrow', sans-serif;
      color: #e8e8e8;
      background: #000;
      z-index: 20;
      overflow: hidden;
      /* Panels stay finger-friendly: taps register instantly and double-tap
         never triggers the browser's page-zoom gesture. */
      touch-action: manipulation;
    }

    .lcars-corner-panel--tl { top: 20px; left: 20px; border-radius: 2px 2px 20px 2px; }
    .lcars-corner-panel--tr { top: 20px; right: 20px; border-radius: 2px 2px 2px 20px; }
    /* Bottom-anchored panels grow upward from a handle pinned to the
       screen edge — column-reverse keeps the (first-in-DOM) header
       visually at the bottom, body opening above it. */
    .lcars-corner-panel--bl { bottom: 20px; left: 20px; flex-direction: column-reverse; border-radius: 2px 20px 2px 2px; }
    .lcars-corner-panel--br { bottom: 20px; right: 20px; flex-direction: column-reverse; border-radius: 20px 2px 2px 2px; }

    .lcars-corner-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      background: var(--accent, #ff9c00);
    }

    .lcars-corner-toggle {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #000;
      cursor: pointer;
    }

    .lcars-corner-toggle:hover { filter: brightness(1.1); }

    .lcars-corner-toggle::after {
      content: '▸';
      font-size: 11px;
      margin-left: 8px;
      transition: transform 0.15s;
    }

    .lcars-corner-toggle[aria-expanded="true"]::after { transform: rotate(90deg); }

    .lcars-corner-body {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      min-height: 0;
      overflow-y: auto;
      background: #000;
    }

    .lcars-corner-panel.is-open .lcars-corner-body { display: flex; }

    /* Objects panel only: a rebuildable sub-container nested inside the
       body, so renderObjectsTab()'s innerHTML wipe never touches the
       selection bar sitting alongside it in the body. */
    .lcars-corner-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    /* Muted by default — this is the only way interface sound turns on.
       Lives in the Camera header (always visible, open or closed) rather
       than any one panel's body, so it's reachable without opening
       anything first. */
    .lcars-hud__audio-toggle {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      appearance: none;
      -webkit-appearance: none;
      margin: 0 6px;
      padding: 3px 7px;
      font-family: inherit;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(0, 0, 0, 0.55);
      background: rgba(0, 0, 0, 0.12);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .lcars-hud__audio-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
    }

    .lcars-hud__audio-toggle[aria-pressed="true"] {
      color: #000;
      background: rgba(0, 0, 0, 0.25);
    }

    .lcars-hud__audio-toggle[aria-pressed="true"] .lcars-hud__audio-dot {
      background: #000;
    }

    /* Stardate readout — also in the Camera header, purely decorative
       "system is alive" flavor, never focusable or announced. */
    .lcars-hud__bar-stardate {
      flex-shrink: 0;
      margin-right: 10px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: rgba(0, 0, 0, 0.6);
      font-variant-numeric: tabular-nums;
    }

    .lcars-hud__selection {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      margin: -10px -10px 0;
      background: var(--lcars-alert);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .lcars-hud__selection[hidden] { display: none; }

    .lcars-hud__selection-label { color: #000; }

    .lcars-hud__selection-value {
      flex: 1;
      overflow: hidden;
      color: #000;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .lcars-hud__selection-clear {
      width: 22px;
      height: 22px;
      font-family: inherit;
      font-size: 11px;
      line-height: 1;
      color: #000;
      background: rgba(0, 0, 0, 0.15);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .lcars-hud__selection-clear:hover { background: rgba(0, 0, 0, 0.3); }

    .lcars-panel {
      background: #0d0d0d;
      border-left: 4px solid var(--accent, #ff9c00);
      border-radius: 3px 14px 14px 3px;
      padding: 0 12px 10px;
      overflow: hidden; /* clips the header chip's bleed to this panel's own rounded corners */
    }

    .lcars-panel--sub { margin-left: 14px; }

    .lcars-panel__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 -12px 8px; /* bleed edge-to-edge, cancelling the panel's own side padding */
      padding: 5px 12px;
      background: var(--accent, #ff9c00);
      color: #000;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .lcars-panel__code {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: rgba(0, 0, 0, 0.55);
    }

    .tool-value {
      margin: 4px 0 6px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }

    .tool-value--text {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .tool-value__unit {
      margin-left: 4px;
      font-size: 11px;
      opacity: 0.55;
    }

    .tool-slider {
      width: 100%;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .tool-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, #ff9c00);
      border: 2px solid #000;
      cursor: pointer;
    }

    .tool-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent, #ff9c00);
      border: 2px solid #000;
      cursor: pointer;
    }

    .tool-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tool-toggle {
      position: relative;
      width: 40px;
      height: 20px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      transition: background 0.15s;
    }

    .tool-toggle:checked { background: var(--accent, #ff9c00); }

    .tool-toggle::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #000;
      transition: transform 0.15s;
    }

    .tool-toggle:checked::before { transform: translateX(20px); }

    .tool-select {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tool-select__opt {
      flex: 1 1 auto;
      padding: 5px 8px;
      font-family: inherit;
      font-size: 10px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .tool-select__opt.is-active {
      background: var(--accent, #ff9c00);
      color: #000;
      font-weight: bold;
    }

    .tool-color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .tool-color-swatch {
      width: 34px;
      height: 26px;
      padding: 0;
      background: none;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
    }

    .tool-file {
      width: 100%;
      margin-top: 6px;
      font-family: inherit;
      font-size: 10px;
      color: #aaa;
    }

    .tool-file::file-selector-button {
      padding: 5px 10px;
      margin-right: 8px;
      font-family: inherit;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #000;
      background: var(--accent, #ff9c00);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .tool-text-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .tool-text-input {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .tool-text-input::placeholder { color: rgba(255, 255, 255, 0.35); }

    .tool-text-button {
      padding: 6px 14px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #000;
      background: var(--accent, #ff9c00);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tool-text-button:hover { filter: brightness(1.15); }

    .tool-text-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .tool-textarea {
      box-sizing: border-box;
      width: 100%;
      height: 60px;
      margin-top: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 10px;
      color: #ccc;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      resize: vertical;
    }

    .tool-program-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .tool-program-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }

    .tool-program-name {
      flex: 1;
      overflow: hidden;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: #fff;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-program-load {
      padding: 4px 10px;
      font-family: inherit;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: #000;
      background: var(--accent, #ff9c00);
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .tool-program-delete {
      width: 20px;
      height: 20px;
      font-size: 10px;
      line-height: 1;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .tool-program-delete:hover { background: rgba(255, 255, 255, 0.25); }

    .tool-program-empty {
      padding: 6px 4px;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
    }

    /* Object chips (Objects tab): one per stellar body, colored by its own
       type accent, plus a "+" chip to add a new one. */
    .tool-object-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 2px;
    }

    .tool-object-chip {
      padding: 6px 10px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 2px solid transparent;
      border-radius: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tool-object-chip.is-focused { border-color: var(--lcars-alert); }

    .tool-object-chip--add {
      width: 30px;
      height: 30px;
      padding: 0;
      font-size: 16px;
      line-height: 1;
      text-align: center;
      border-radius: 50%;
      background: var(--lcars-alert);
      color: #000;
      border-color: transparent;
    }

    /* Orbital Telemetry (Objects tab) — a compact live-value grid instead
       of one full-height panel per number, so four readouts cost roughly
       what one slider does. */
    .tool-telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      margin-top: 4px;
    }

    .tool-telemetry-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tool-telemetry-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
    }

    .tool-telemetry-value {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* One consistent themed focus ring for every keyboard-reachable control,
       instead of leaving it to inconsistent browser defaults — and restoring
       it where .tool-slider/.tool-toggle removed the native outline entirely. */
    .lcars-corner-toggle:focus-visible,
    .tool-slider:focus-visible,
    .tool-toggle:focus-visible,
    .tool-select__opt:focus-visible,
    .tool-color-swatch:focus-visible,
    .tool-file:focus-visible,
    .tool-text-input:focus-visible,
    .tool-text-button:focus-visible,
    .tool-program-load:focus-visible,
    .tool-program-delete:focus-visible,
    .tool-textarea:focus-visible,
    .tool-object-chip:focus-visible,
    .lcars-hud__selection-clear:focus-visible,
    .lcars-hud__audio-toggle:focus-visible {
      outline: 2px solid var(--lcars-alert);
      outline-offset: 2px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- The four corner control panels (Objects/Appearance/Camera/Files) are
       built entirely in JS — see "LCARS Corner Panels" further down —
       matching how their inner content panels were already constructed. -->

  <script>
    // --- Application State & Parameters ---
    // Feature pivot: floor/sky and the fixed Source+Runner model are gone.
    // In their place, a dynamic, user-extensible hierarchy of stellar
    // bodies — each one positioned and moved relative to whichever other
    // body it's nested under, all the way up to a single fixed root. See
    // OBJECT_TYPES and the Shared Gravity Law section below for how mass
    // drives both the hierarchy and the actual simulated motion.
    const params = {
      camera: {
        fov: 50,
        trackingMode: 'Free Orbit Overview', // 'Free Orbit Overview' | 'Follow Selected' | 'Static Origin View' | 'Manual Control'
        distance: 12,
        height: 3.5
      },
      // How every object's surface (except a Singularity, always unlit) is
      // shaded — see buildObjectMaterial(). 'Shaded' = normal PBR gradient
      // response, 'Posterized' = 3-band cel/toon shading, 'Flat Light' =
      // no shading at all, flat color regardless of light angle. Defaults
      // to 'Flat Light' — LCARS was flat design before "flat design" had
      // a name, and that same solid-color, no-gradient language extends
      // naturally from the HUD chrome to the construct itself.
      lightingMode: 'Flat Light',
      // Every stellar object: { id, name, type, parentId, mass, size,
      // shape, color, orbit: { distance, speedRatio, angleDeg },
      // pathColor, pathVisible }. parentId: null means "fixed at the
      // universal center" — normally true of exactly one root object
      // (e.g. the Sun). Populated with a default Terran solar system
      // below, after OBJECT_TYPES is defined.
      objects: []
    };

    // --- Memory: Save/Load Programs (persistence) ---
    // `params` is fully JSON-safe — plain values, arrays, nested plain
    // objects, no functions or circular refs — so a snapshot is just a
    // stringify. Loading works by writing the chosen snapshot into a
    // "pending load" slot and reloading the page: the very first thing this
    // script does on the next run (right here, before any 3D object or HUD
    // control is built) is merge that snapshot onto the defaults above.
    // Uploaded custom object models aren't captured (their raw file bytes
    // never touch `params`), so loading a program that used one falls back
    // to that object's normal placeholder shape, same as picking "Custom"
    // fresh without a file — never a crash, just a re-upload prompt.
    //
    // NOTE: this is a clean break from the previous Source/Orbit/Cube/
    // Runner/Floor/Sky schema — programs saved before this rewrite will
    // still *load* (deepMerge just won't find an `objects` array in them,
    // so nothing overwrites the fresh default solar system below), but
    // they won't restore whatever scene they used to represent. There's no
    // way to bridge that automatically since the whole data model changed.
    const MEMORY_KEY = 'eclipseStimulator.savedPrograms';
    const PENDING_LOAD_KEY = 'eclipseStimulator.pendingLoad';

    function safeLocalStorageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeLocalStorageSet(key, value) {
      try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
    }
    function safeLocalStorageRemove(key) {
      try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
    }

    function deepMerge(target, source) {
      Object.keys(source).forEach(key => {
        const value = source[key];
        if (Array.isArray(value)) {
          target[key] = value;
        } else if (value && typeof value === 'object') {
          if (!target[key] || typeof target[key] !== 'object') target[key] = {};
          deepMerge(target[key], value);
        } else {
          target[key] = value;
        }
      });
      return target;
    }

    let pendingObjectsLoad = null; // captured here, applied after OBJECT_TYPES/defaults exist

    (function applyPendingLoad() {
      let pending = null;
      try {
        pending = JSON.parse(safeLocalStorageGet(PENDING_LOAD_KEY) || 'null');
      } catch (e) {
        pending = null;
      }
      if (!pending) return;
      safeLocalStorageRemove(PENDING_LOAD_KEY);
      deepMerge(params, pending);
      if (Array.isArray(pending.objects) && pending.objects.length) pendingObjectsLoad = pending.objects;
    })();

    function snapshotParams() {
      return JSON.parse(JSON.stringify(params));
    }

    function listPrograms() {
      const raw = safeLocalStorageGet(MEMORY_KEY);
      if (!raw) return {};
      try { return JSON.parse(raw); } catch (e) { return {}; }
    }

    function saveProgram(name) {
      const programs = listPrograms();
      programs[name] = snapshotParams();
      return safeLocalStorageSet(MEMORY_KEY, JSON.stringify(programs));
    }

    function deleteProgram(name) {
      const programs = listPrograms();
      delete programs[name];
      return safeLocalStorageSet(MEMORY_KEY, JSON.stringify(programs));
    }

    function loadProgram(name) {
      const programs = listPrograms();
      if (!programs[name]) return false;
      if (!safeLocalStorageSet(PENDING_LOAD_KEY, JSON.stringify(programs[name]))) return false;
      location.reload();
      return true;
    }

    // Base64 JSON, safe to paste into a text field. unescape/encodeURIComponent
    // is the standard trick for letting btoa/atob round-trip UTF-8, not just Latin-1.
    function exportProgramCode(snapshot) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(snapshot))));
    }

    function importProgramFromCode(code) {
      try {
        return JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      } catch (e) {
        return null;
      }
    }

    // The Source/Orbit/Runner/Floor/Sky schema this replaced has no
    // `objects` array — a save from before that rewrite would load without
    // crashing (deepMerge just wouldn't find one) but would silently show
    // the default solar system instead of whatever it used to represent,
    // which is confusing to leave sitting in the saved-programs list. Prune
    // those out once, up front, so Stored Programs only ever lists saves
    // this schema can actually restore. Idempotent — a no-op once run.
    function pruneLegacyPrograms() {
      const programs = listPrograms();
      let changed = false;
      Object.keys(programs).forEach(name => {
        const snap = programs[name];
        if (!snap || !Array.isArray(snap.objects) || snap.objects.length === 0) {
          delete programs[name];
          changed = true;
        }
      });
      if (changed) safeLocalStorageSet(MEMORY_KEY, JSON.stringify(programs));
    }
    pruneLegacyPrograms();

    // --- LCARS Design Tokens ---
    // One named palette, reused everywhere a "which category is this"
    // color decision gets made — the tab accents, the selection highlight,
    // and several object-type accents all read from here instead of each
    // carrying its own coincidentally-similar hex literal. Pushed onto
    // :root as CSS custom properties so the static chrome (hint pill, HUD
    // title, selection bar) consumes the exact same values as the JS-built
    // tabs.
    const LCARS_PALETTE = {
      butterscotch: '#ff9c00',  // HUD title bar + summon hint + Sun accent
      africanViolet: '#cc99cc', // (reserved accent)
      periwinkle: '#9999ff',    // Objects tab
      gold: '#ffcc66',          // (reserved accent)
      mars: '#ff6666',          // Satellite accent
      ice: '#66ccff',           // Camera tab + Planet accent
      salmon: '#ff9977',        // Asteroid accent
      plum: '#cc6699',          // Memory tab + Individual accent
      alert: '#33ffff'          // Selection highlight + focused object chip
    };

    function hexToNum(hex) {
      return parseInt(hex.replace('#', ''), 16);
    }

    // A near-black tint of a palette color, used for the inactive-tab
    // background so even unselected categories hint at their own color
    // instead of falling back to generic gray.
    function dimHex(hex, blackMix) {
      const n = hexToNum(hex);
      const keep = 1 - blackMix;
      const toHex = v => Math.round(v * keep).toString(16).padStart(2, '0');
      return '#' + toHex((n >> 16) & 255) + toHex((n >> 8) & 255) + toHex(n & 255);
    }

    Object.entries(LCARS_PALETTE).forEach(([name, hex]) => {
      const cssVar = '--lcars-' + name.replace(/([A-Z])/g, '-$1').toLowerCase();
      document.documentElement.style.setProperty(cssVar, hex);
    });

    // --- Scene, Renderer & Global References ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    const camera = new THREE.PerspectiveCamera(
      params.camera.fov,
      window.innerWidth / window.innerHeight,
      0.1,
      2000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Dim ambient fill so non-illuminated areas (anything not near a Sun)
    // are still faintly legible instead of pure black.
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.08);
    scene.add(ambientLight);

    // --- Object Types ---
    // Purely a display/organizational label plus sensible starting values —
    // the physics only ever cares about an object's mass/parent/orbit, not
    // its type. massRange/sizeRange bound that type's Mass/Size sliders
    // (a Moon and a Sun don't want the same slider resolution).
    const OBJECT_TYPES = {
      SINGULARITY: { label: 'Singularity', color: '#180022', massRange: [1000, 20000], sizeRange: [1, 10], defaultMass: 8000, defaultSize: 3, defaultShape: 'Sphere' },
      SUN:         { label: 'Sun', color: LCARS_PALETTE.butterscotch, massRange: [500, 6000], sizeRange: [3, 15], defaultMass: 3000, defaultSize: 9, defaultShape: 'Sphere' },
      PLANET:      { label: 'Planet', color: LCARS_PALETTE.ice, massRange: [5, 400], sizeRange: [0.4, 4], defaultMass: 43, defaultSize: 1.0, defaultShape: 'Sphere' },
      MOON:        { label: 'Moon', color: '#a8a8a8', massRange: [0.5, 50], sizeRange: [0.1, 1.5], defaultMass: 10, defaultSize: 0.3, defaultShape: 'Sphere' },
      ASTEROID:    { label: 'Asteroid', color: LCARS_PALETTE.salmon, massRange: [0.1, 20], sizeRange: [0.1, 1], defaultMass: 5, defaultSize: 0.25, defaultShape: 'Prism' },
      SHIP:        { label: 'Ship', color: '#e0e0e0', massRange: [0.01, 20], sizeRange: [0.3, 3], defaultMass: 3, defaultSize: 0.9, defaultShape: 'Starship' },
      SATELLITE:   { label: 'Artificial Satellite', color: LCARS_PALETTE.mars, massRange: [0.01, 10], sizeRange: [0.1, 1], defaultMass: 2, defaultSize: 0.3, defaultShape: 'Prism' },
      INDIVIDUAL:  { label: 'Individual', color: LCARS_PALETTE.plum, massRange: [0.001, 5], sizeRange: [0.05, 0.5], defaultMass: 0.5, defaultSize: 0.15, defaultShape: 'Cube' }
    };
    const OBJECT_TYPE_ORDER = ['SINGULARITY', 'SUN', 'PLANET', 'MOON', 'ASTEROID', 'SHIP', 'SATELLITE', 'INDIVIDUAL'];
    const OBJECT_TYPE_LABELS = Object.fromEntries(OBJECT_TYPE_ORDER.map(t => [t, OBJECT_TYPES[t].label]));

    // --- Shared Gravity Law ---
    // Every object orbits whichever object is its `parentId` (or sits fixed
    // at the universal center if it has none) — a patched, hierarchical
    // 2-body model (each object only ever feels its own immediate parent's
    // pull, not every other object's) rather than full N-body gravity. This
    // is the standard simplified technique real solar-system toys and games
    // use, and it's exactly what "nested by mass, to its logical hierarchy"
    // means mechanically: a parent's `mass` directly becomes the
    // gravitational parameter (mu, ~ G·M with G = 1 in these sim units)
    // pulling on every child orbiting it. Deliberately planar (XZ, y=0) —
    // every orbit lives in its parent's local XZ plane — which still
    // produces rich compound motion once orbits are nested (a moon loops
    // around a moving planet), without the complexity of independent 3D
    // orbital planes.
    function gravityStep(state, dt, mu) {
      const distSq = state.x * state.x + state.z * state.z;
      const dist = Math.sqrt(distSq) || 0.0001;
      const accel = -mu / distSq;
      state.vx += accel * (state.x / dist) * dt;
      state.vz += accel * (state.z / dist) * dt;
      state.x += state.vx * dt;
      state.z += state.vz * dt;
    }

    // Real per-frame deltas can be too coarse for stable integration close
    // to a massive parent; subdividing into small fixed substeps keeps
    // orbits numerically well-behaved regardless of frame rate. Symplectic
    // (semi-implicit) Euler — velocity updates from the *current* position's
    // acceleration first, then position advances with the *new* velocity —
    // stays stable over many orbits instead of visibly spiraling.
    const GRAVITY_SUBSTEP = 1 / 240;
    function integrateGravity(state, totalDt, mu) {
      let remaining = totalDt;
      while (remaining > 0) {
        const dt = Math.min(GRAVITY_SUBSTEP, remaining);
        gravityStep(state, dt, mu);
        remaining -= dt;
      }
    }

    // Seeds an orbit state at `distance` from a parent of gravitational
    // parameter mu, at the given starting angle, launched tangentially
    // (perpendicular to the radius — the standard prograde launch) at
    // speedRatio × the local circular speed. speedRatio alone sweeps the
    // whole conic-section family: <1 falls inward from an apoapsis start,
    // 1 is a perfect circle, up to ~1.41 increasingly eccentric, ~1.41 is
    // the literal parabolic escape threshold, beyond that hyperbolic.
    function seedOrbitState(mu, distance, angleDeg, speedRatio) {
      const angle = angleDeg * Math.PI / 180;
      const x = Math.cos(angle) * distance;
      const z = Math.sin(angle) * distance;
      const vCircular = Math.sqrt(mu / distance);
      const speed = speedRatio * vCircular;
      const tangentAngle = angle + Math.PI / 2;
      return { x, z, vx: Math.cos(tangentAngle) * speed, vz: Math.sin(tangentAngle) * speed };
    }

    // --- Object Visuals ---
    // Built at a canonical "1 unit" scale, then the object's own Size is
    // applied as a uniform scale multiplier on the whole root — one
    // consistent sizing mechanism for every shape, single mesh or composite.
    function buildShapeGeometry(shape) {
      switch (shape) {
        case 'Sphere': return new THREE.SphereGeometry(0.5, 24, 16);
        case 'Prism': return new THREE.CylinderGeometry(0.5, 0.5, 1, 6); // hexagonal prism
        case 'Cube':
        default: return new THREE.BoxGeometry(1, 1, 1);
      }
    }

    // --- Lighting Mode ---
    // Global shading style for every object's surface, except a
    // Singularity (always unlit — see buildObjectVisual) and the path
    // lines below (THREE.Line materials are always unlit regardless).
    // 'Posterized' uses MeshToonMaterial with a hand-built 3-step gradient
    // map, so the surface only ever renders one of 3 discrete tones
    // instead of a smooth gradient — genuine cel/toon shading, the same
    // mechanism real toon-shaded 3D work uses, not a shader hack.
    let toonGradientMap = null;
    function ensureToonGradientMap() {
      if (toonGradientMap) return toonGradientMap;
      const steps = 3;
      const canvas = document.createElement('canvas');
      canvas.width = steps;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      for (let i = 0; i < steps; i++) {
        const v = Math.round((i / (steps - 1)) * 255);
        ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
        ctx.fillRect(i, 0, 1, 1);
      }
      const tex = new THREE.CanvasTexture(canvas);
      // Nearest (not linear) filtering is what keeps the bands sharp —
      // without it the GPU would smoothly interpolate right back to a
      // regular gradient between the 3 texels.
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      toonGradientMap = tex;
      return tex;
    }

    function buildObjectMaterial(color) {
      switch (params.lightingMode) {
        case 'Flat Light':
          return new THREE.MeshBasicMaterial({ color });
        case 'Posterized':
          return new THREE.MeshToonMaterial({ color, gradientMap: ensureToonGradientMap() });
        case 'Shaded':
        default:
          return new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.15 });
      }
    }

    // A stylized saucer/engineering-hull/twin-nacelle silhouette — built
    // from primitives, not a real Enterprise model (no such asset is
    // available here to load). Reads as "a starship" at a glance without
    // claiming to be a faithful reproduction.
    function buildStarshipGroup(color) {
      const group = new THREE.Group();
      const mat = buildObjectMaterial(color);

      const saucer = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.12, 24), mat);
      saucer.position.set(0, 0.15, 0.3);
      group.add(saucer);

      const hull = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.9, 12), mat);
      hull.rotation.x = Math.PI / 2;
      hull.position.set(0, 0, -0.15);
      group.add(hull);

      [-1, 1].forEach(side => {
        const nacelle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.8, 10), mat);
        nacelle.rotation.x = Math.PI / 2;
        nacelle.position.set(side * 0.35, 0.05, -0.05);
        group.add(nacelle);

        const strut = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.3), mat);
        strut.position.set(side * 0.2, 0.05, 0.05);
        group.add(strut);
      });

      return group;
    }

    // Normalizes a loaded STL/OBJ object (any size/origin/units) to sit
    // centered at local origin at a size comparable to the built-in shapes,
    // so the caller's uniform Size scale-multiplier behaves consistently
    // whether the shape is a primitive or an uploaded model.
    function normalizeCustomObject(object3D) {
      const box = new THREE.Box3().setFromObject(object3D);
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 1.4 / maxDim;
      object3D.scale.setScalar(scale);
      object3D.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
    }

    const objectRuntime = new Map();   // id -> { root, allMeshes, light, gState, config }
    const meshToObjectId = new Map();  // THREE.Mesh -> object id, for selection raycasting
    const customModelCache = new Map(); // id -> uploaded THREE.Object3D template to clone from

    const stlLoader = new THREE.STLLoader();
    const objLoader = new THREE.OBJLoader();

    // Attaches a warm-white point light to a Sun-type object, so it moves
    // with it automatically (added as its own child, not the scene's) —
    // the one place this construct still casts real shadows from. A
    // Singularity deliberately does *not* get one (see buildObjectVisual).
    //
    // decay: 0 (not the usual 1-2) is deliberate, not an oversight — a
    // real inverse-square/-linear falloff was tuned for the previous
    // scene's fixed ~35-unit orbit radius, but this system spans 15.6
    // (Mercury) to 137 (Neptune) units, an 8.8× range. Under any real
    // falloff, tuning for Mercury leaves Neptune essentially unlit and
    // tuning for Neptune blows Mercury out to solid white — there's no
    // single distance-based intensity that reads correctly at both ends.
    // decay: 0 makes every object's illumination depend only on its
    // surface angle to the light (proper day/night shading), not its
    // distance, so the whole system reads consistently — the same
    // deliberate, disclosed artistic license already applied to mass and
    // distance elsewhere in this construct. `distance` (500) still acts
    // as a hard cutoff, just far beyond anything in the default system.
    function attachLightIfSun(root, obj) {
      if (obj.type !== 'SUN') return null;
      const light = new THREE.PointLight(0xfff4e0, 3.0, 500, 0);
      light.castShadow = true;
      light.shadow.mapSize.width = 2048;
      light.shadow.mapSize.height = 2048;
      light.shadow.bias = -0.001;
      root.add(light);
      return light;
    }

    function buildObjectVisual(obj) {
      let root;
      if (obj.shape === 'Starship') {
        root = buildStarshipGroup(obj.color);
      } else if (obj.shape === 'Custom') {
        const template = customModelCache.get(obj.id);
        if (template) {
          root = template.clone(true);
          normalizeCustomObject(root);
        } else {
          // Placeholder until a model is uploaded — never a crash, just a re-upload prompt.
          root = new THREE.Mesh(buildShapeGeometry('Cube'), buildObjectMaterial(obj.color));
        }
      } else if (obj.type === 'SINGULARITY') {
        // Unlit on purpose, regardless of Lighting Mode — a black hole
        // doesn't reflect or emit light, the opposite of the Sun's
        // attached PointLight above.
        root = new THREE.Mesh(buildShapeGeometry(obj.shape), new THREE.MeshBasicMaterial({ color: obj.color }));
      } else {
        root = new THREE.Mesh(buildShapeGeometry(obj.shape), buildObjectMaterial(obj.color));
      }
      root.scale.multiplyScalar(obj.size);

      const allMeshes = [];
      root.traverse(node => {
        if (node.isMesh) {
          node.castShadow = obj.type !== 'SINGULARITY';
          node.receiveShadow = true;
          allMeshes.push(node);
          meshToObjectId.set(node, obj.id);
        }
      });
      scene.add(root);
      const light = attachLightIfSun(root, obj);
      return { root, allMeshes, light };
    }

    function disposeVisual(rt) {
      rt.allMeshes.forEach(m => {
        meshToObjectId.delete(m);
        if (m.geometry && m.geometry.dispose) m.geometry.dispose();
        if (m.material && m.material.dispose) m.material.dispose();
      });
      scene.remove(rt.root);
    }

    // Swaps every non-Singularity object's material in place for the
    // newly-selected Lighting Mode — cheap (materials only, no geometry
    // rebuild) since Custom/Starship composites already expose every
    // sub-mesh via allMeshes.
    function applyLightingModeToAllObjects() {
      params.objects.forEach(obj => {
        if (obj.type === 'SINGULARITY') return;
        const rt = objectRuntime.get(obj.id);
        if (!rt) return;
        rt.allMeshes.forEach(mesh => {
          if (mesh.material && mesh.material.dispose) mesh.material.dispose();
          mesh.material = buildObjectMaterial(obj.color);
        });
      });
    }

    // --- Orbit Path Visualization ---
    // Draws an object's *exact* orbital shape — the real conic section
    // implied by its current mass/distance/speed, not an approximated
    // trail — as a static line around its parent. This is possible without
    // deriving the general orbital-element (eccentricity-vector) formula
    // because every orbit here is seeded with a purely tangential launch
    // (see seedOrbitState), which is exactly the condition that defines an
    // apsis (periapsis if speedRatio ≥ 1, apoapsis if < 1) — so the whole
    // shape drops out of the standard focus-at-origin polar conic equation
    // r(θ) = p / (1 + e·cos(θ − θ_periapsis)) with the parent's local
    // origin as the shared focus. The shape only needs recomputing when
    // the seed conditions themselves change (Distance/Speed/Angle/Parent/
    // Mass) — two-body motion conserves it exactly in between, so it's
    // never touched per-frame, only the line's position (to follow a
    // moving parent) is.
    function closedConicPoints(a, e, periapsisAngle, segments) {
      const p = a * (1 - e * e);
      const points = [];
      for (let i = 0; i <= segments; i++) {
        const theta = (i / segments) * Math.PI * 2;
        const r = p / (1 + e * Math.cos(theta));
        const worldAngle = periapsisAngle + theta;
        points.push({ x: Math.cos(worldAngle) * r, z: Math.sin(worldAngle) * r });
      }
      return points;
    }

    function openConicPoints(e, semiLatusRectum, periapsisAngle, segments) {
      const thetaMax = Math.acos(Math.max(-1, Math.min(1, -1 / e))) * 0.98; // stop just short of the asymptote
      const points = [];
      for (let i = 0; i <= segments; i++) {
        const theta = -thetaMax + (i / segments) * (2 * thetaMax);
        const r = semiLatusRectum / (1 + e * Math.cos(theta));
        const worldAngle = periapsisAngle + theta;
        points.push({ x: Math.cos(worldAngle) * r, z: Math.sin(worldAngle) * r });
      }
      return points;
    }

    function computeOrbitShapePoints(mu, distance, angleDeg, speedRatio) {
      const r0 = distance;
      const v0 = speedRatio * Math.sqrt(mu / r0);
      const energy = 0.5 * v0 * v0 - mu / r0;
      const angleRad = angleDeg * Math.PI / 180;
      const periapsisAngle = speedRatio >= 1 ? angleRad : angleRad + Math.PI;
      const SEGMENTS = 96;
      if (Math.abs(energy) < 1e-6) {
        // Parabolic (the razor's-edge escape case) — an open arc, same
        // treatment as hyperbolic, not a closed loop.
        return openConicPoints(1, r0 * 2, periapsisAngle, SEGMENTS);
      }
      const a = -mu / (2 * energy);
      const e = Math.abs(1 - r0 / a);
      if (a > 0) return closedConicPoints(a, e, periapsisAngle, SEGMENTS);
      return openConicPoints(e, a * (1 - e * e), periapsisAngle, SEGMENTS);
    }

    // Same seed-condition derivation as computeOrbitShapePoints, but
    // returning the numbers themselves (semi-major axis, eccentricity,
    // period) instead of a line's worth of points — feeds the Orbital
    // Telemetry readout. period is null for an unbound (parabolic/
    // hyperbolic) trajectory, which has no period.
    function computeOrbitElements(mu, distance, angleDeg, speedRatio) {
      const r0 = distance;
      const v0 = speedRatio * Math.sqrt(mu / r0);
      const energy = 0.5 * v0 * v0 - mu / r0;
      if (Math.abs(energy) < 1e-6) return { a: Infinity, e: 1, period: null };
      const a = -mu / (2 * energy);
      const e = Math.abs(1 - r0 / a);
      const period = a > 0 ? 2 * Math.PI * Math.sqrt(Math.pow(a, 3) / mu) : null;
      return { a, e, period };
    }

    // The smallest Orbit Distance that keeps a child clear of its parent's
    // own rendered body — both radii approximated as half their Size
    // (a fair clearance estimate for every built-in shape, Starship/Custom
    // included, without needing each one's exact silhouette). Recomputed
    // wherever the Objects tab panel is rebuilt, so it responds to Size
    // changes at the next natural render rather than needing its own
    // live-drag wiring.
    function minOrbitDistanceFor(obj, parentObj) {
      const parentRadius = 0.5 * ((parentObj && parentObj.size) || 1);
      const ownRadius = 0.5 * (obj.size || 1);
      return Math.max(2, parentRadius + ownRadius + 1);
    }

    const orbitPathLines = new Map(); // object id -> THREE.Line

    function disposeOrbitPathLine(id) {
      const line = orbitPathLines.get(id);
      if (!line) return;
      scene.remove(line);
      line.geometry.dispose();
      line.material.dispose();
      orbitPathLines.delete(id);
    }

    // (Re)builds the visible orbit-path line for one object from its
    // *current* seed conditions — called whenever those conditions change,
    // and whenever the path is first switched on. A no-op (with cleanup)
    // for anything without a parent/orbit, since there's no shape to draw.
    function rebuildOrbitPathLine(obj) {
      disposeOrbitPathLine(obj.id);
      if (!obj.pathVisible) return;
      const parentRt = obj.parentId ? objectRuntime.get(obj.parentId) : null;
      if (!parentRt || !(obj.orbit.distance > 0)) return;
      const mu = Math.max(0.5, parentRt.config.mass);
      const localPoints = computeOrbitShapePoints(mu, obj.orbit.distance, obj.orbit.angleDeg, obj.orbit.speedRatio);
      const points3D = localPoints.map(p => new THREE.Vector3(p.x, 0, p.z));
      const geometry = new THREE.BufferGeometry().setFromPoints(points3D);
      const material = new THREE.LineBasicMaterial({ color: hexToNum(obj.pathColor || obj.color), transparent: true, opacity: 0.75 });
      const line = new THREE.Line(geometry, material);
      line.position.set(parentRt.absX || 0, parentRt.absY || 0, parentRt.absZ || 0);
      scene.add(line);
      orbitPathLines.set(obj.id, line);
    }

    // Structural rebuild (shape/model changed) — Size and Color changes are
    // cheap in-place updates instead (see the Objects tab panel wiring).
    function rebuildObjectVisual(id) {
      const obj = params.objects.find(o => o.id === id);
      const rt = objectRuntime.get(id);
      if (!obj || !rt) return;
      disposeVisual(rt);
      const fresh = buildObjectVisual(obj);
      objectRuntime.set(id, Object.assign(rt, fresh));
    }

    function loadCustomObjectFile(id, file) {
      const name = file.name.toLowerCase();
      const reader = new FileReader();
      const handleLoaded = object3D => {
        customModelCache.set(id, object3D);
        rebuildObjectVisual(id);
      };
      if (name.endsWith('.stl')) {
        reader.onload = e => handleLoaded(new THREE.Mesh(stlLoader.parse(e.target.result)));
        reader.readAsArrayBuffer(file);
      } else if (name.endsWith('.obj')) {
        reader.onload = e => handleLoaded(objLoader.parse(e.target.result));
        reader.readAsText(file);
      } else {
        alert('Unsupported file type — please choose an .stl or .obj file.');
      }
    }

    // (Re)seeds an object's orbital state from its current orbit params —
    // called on creation and on any Distance/Speed/Angle/Parent edit, since
    // those describe a *launch condition*, not a continuously-authored path.
    function reseedObjectOrbit(obj) {
      const rt = objectRuntime.get(obj.id);
      if (!rt) return;
      const parentRt = obj.parentId ? objectRuntime.get(obj.parentId) : null;
      if (!parentRt || !(obj.orbit.distance > 0)) {
        rt.gState = null; // fixed at the parent's position (or at the universal center if no parent)
        disposeOrbitPathLine(obj.id);
        return;
      }
      const mu = Math.max(0.5, parentRt.config.mass);
      rt.gState = seedOrbitState(mu, obj.orbit.distance, obj.orbit.angleDeg, obj.orbit.speedRatio);
      // Keep an already-lit path in sync with the new seed conditions; a
      // still-off one stays off (rebuildOrbitPathLine no-ops on !pathVisible).
      rebuildOrbitPathLine(obj);
    }

    function createObjectRuntime(obj) {
      const visual = buildObjectVisual(obj);
      objectRuntime.set(obj.id, { root: visual.root, allMeshes: visual.allMeshes, light: visual.light, gState: null, config: obj });
      reseedObjectOrbit(obj);
    }

    function destroyObjectRuntime(id) {
      const rt = objectRuntime.get(id);
      if (!rt) return;
      disposeVisual(rt);
      disposeOrbitPathLine(id);
      objectRuntime.delete(id);
      customModelCache.delete(id);
    }

    // Depth-sorted (root first) so each frame's physics/position pass can
    // assume a parent's absolute position is already known before any of
    // its children are processed. Recomputed only on structural changes
    // (add/remove/reparent), not every frame.
    let hierarchyOrderCache = [];
    function rebuildHierarchyOrder() {
      const byId = new Map(params.objects.map(o => [o.id, o]));
      function depthOf(o) {
        let d = 0, cur = o, guard = 0;
        while (cur.parentId && byId.has(cur.parentId) && guard++ < 64) {
          cur = byId.get(cur.parentId);
          d++;
        }
        return d;
      }
      hierarchyOrderCache = params.objects.slice().sort((a, b) => depthOf(a) - depthOf(b));
    }

    // True if `candidateId` is anywhere in `ancestorId`'s own descendant
    // chain — used to keep the Parent dropdown from ever offering a choice
    // that would create a cycle.
    function isDescendantOf(candidateId, ancestorId, byId) {
      let cur = byId.get(candidateId);
      let guard = 0;
      while (cur && cur.parentId && guard++ < 64) {
        if (cur.parentId === ancestorId) return true;
        cur = byId.get(cur.parentId);
      }
      return false;
    }

    function objectDisplayName(obj) {
      return obj.name || OBJECT_TYPES[obj.type].label;
    }

    function mostMassiveObject() {
      if (params.objects.length === 0) return null;
      return params.objects.reduce((a, b) => (b.mass > a.mass ? b : a));
    }

    let focusedObjectId = null;   // which object's detail panel the Objects tab shows
    let selectedObjectId = null;  // which object is picked in the 3D scene (see Entity Selection)

    // "Click + to add stellar object" — defaults its parent to whatever's
    // currently most massive (the closest thing to "its logical hierarchy
    // by mass" without asking the user to place it manually every time),
    // and its Distance to comfortably clear that parent's own visual size.
    // Always focuses the new object right away so its controls are the
    // next thing the user sees, ready to refine.
    function addObject(type) {
      type = type || 'PLANET';
      const meta = OBJECT_TYPES[type];
      const existingOfType = params.objects.filter(o => o.type === type).length;
      const parent = params.objects.length === 0 ? null : mostMassiveObject();
      const id = 'obj-' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
      const obj = {
        id,
        name: meta.label + (existingOfType > 0 ? ' ' + (existingOfType + 1) : ''),
        type,
        parentId: parent ? parent.id : null,
        mass: meta.defaultMass,
        size: meta.defaultSize,
        shape: meta.defaultShape,
        color: meta.color,
        orbit: {
          distance: parent ? Math.max(6, (parent.size || 1) * 4) : 0,
          speedRatio: 1.0,
          angleDeg: Math.floor(Math.random() * 360)
        }
      };
      params.objects.push(obj);
      createObjectRuntime(obj);
      rebuildHierarchyOrder();
      // Select it, not just focus it — see the chip click handler's
      // comment in renderObjectsTab() for why that distinction matters
      // (Camera → Follow Selected only ever looks at the real selection).
      const rt = objectRuntime.get(id);
      if (rt) {
        setSelection({ root: rt.root, label: objectDisplayName(obj), objectId: id });
      } else {
        focusedObjectId = id;
        renderObjectsTab();
      }
      playTick();
      return obj;
    }

    // Deleting a parent re-parents its children up to *its* parent instead
    // of stranding them with a dangling reference — a planet's moons stay
    // in orbit around the sun if the planet itself is removed.
    function removeObject(id) {
      const idx = params.objects.findIndex(o => o.id === id);
      if (idx === -1 || params.objects.length <= 1) return; // always keep at least one object
      const removed = params.objects[idx];
      params.objects.forEach(o => { if (o.parentId === id) { o.parentId = removed.parentId; reseedObjectOrbit(o); } });
      if (selectedObjectId === id) clearSelection();
      destroyObjectRuntime(id);
      params.objects.splice(idx, 1);
      rebuildHierarchyOrder();
      if (focusedObjectId === id) focusedObjectId = params.objects.length ? params.objects[0].id : null;
      renderObjectsTab();
      playTick();
    }

    // --- Default Construct: the Terran Solar System ---
    // Real relative mass/distance *ordering* is preserved (Sun ≫ Jupiter >
    // Saturn > Neptune > Uranus > Earth > Venus > Mars > Mercury > Moon,
    // and Mercury < Venus < Earth < Mars < asteroid belt < Jupiter < ...
    // outward), but the absolute numbers are not real astronomical units.
    // Real mass ratios span ~7 orders of magnitude (Sun ≈ 333,000 Earths)
    // and, via Kepler's third law, that turns into an even more extreme
    // spread of orbital periods — a literally-scaled solar system would
    // make Mercury lap the Sun in seconds while Neptune took days. Masses
    // here are real Earth-mass ratios compressed by a cube root and
    // distances by a square root, which keeps every body's relative
    // standing correct while fitting the whole system into a few minutes
    // of watchable motion. Earth's Moon, an Artificial Satellite, and the
    // Enterprise all orbit Earth at hand-picked (not astronomically real)
    // distances, spaced apart so they don't collide.
    function buildDefaultSolarSystem() {
      const bodies = [
        { name: 'Sol', type: 'SUN', mass: 3000, size: 9, parent: null, distance: 0, angle: 0 },
        { name: 'Mercury', type: 'PLANET', mass: 16, size: 0.5, parent: 'Sol', distance: 15.6, angle: 0 },
        { name: 'Venus', type: 'PLANET', mass: 40, size: 0.9, parent: 'Sol', distance: 21.2, angle: 40 },
        { name: 'Earth', type: 'PLANET', mass: 43, size: 1.0, parent: 'Sol', distance: 25, angle: 80 },
        { name: 'Moon', type: 'MOON', mass: 10, size: 0.3, parent: 'Earth', distance: 6, angle: 0 },
        { name: 'Comm Satellite', type: 'SATELLITE', mass: 2, size: 0.3, shape: 'Prism', parent: 'Earth', distance: 4, angle: 120 },
        { name: 'Enterprise', type: 'SHIP', mass: 3, size: 0.9, shape: 'Starship', color: '#e8e8e8', parent: 'Earth', distance: 8, angle: 240 },
        { name: 'Mars', type: 'PLANET', mass: 21, size: 0.55, parent: 'Sol', distance: 30.9, angle: 120 },
        { name: 'Ceres', type: 'ASTEROID', mass: 5, size: 0.25, shape: 'Prism', parent: 'Sol', distance: 41.1, angle: 160 },
        { name: 'Jupiter', type: 'PLANET', mass: 296, size: 3.2, parent: 'Sol', distance: 57, angle: 200 },
        { name: 'Saturn', type: 'PLANET', mass: 197, size: 2.8, parent: 'Sol', distance: 77.4, angle: 240 },
        { name: 'Uranus', type: 'PLANET', mass: 106, size: 1.8, parent: 'Sol', distance: 109.6, angle: 280 },
        { name: 'Neptune', type: 'PLANET', mass: 111, size: 1.9, parent: 'Sol', distance: 137, angle: 320 }
      ];
      const idByName = {};
      bodies.forEach(b => {
        const meta = OBJECT_TYPES[b.type];
        const id = 'obj-' + b.name.toLowerCase().replace(/\s+/g, '-');
        idByName[b.name] = id;
        const obj = {
          id,
          name: b.name,
          type: b.type,
          parentId: b.parent ? idByName[b.parent] : null,
          mass: b.mass,
          size: b.size,
          shape: b.shape || meta.defaultShape,
          color: b.color || meta.color,
          orbit: { distance: b.distance, speedRatio: 1.0, angleDeg: b.angle }
        };
        params.objects.push(obj);
        createObjectRuntime(obj);
      });
      rebuildHierarchyOrder();
      focusedObjectId = idByName['Sol'];
    }

    if (pendingObjectsLoad) {
      // A loaded/imported program already fully replaced params.objects
      // (see applyPendingLoad) — just build runtime state from it instead
      // of the default system.
      pendingObjectsLoad.forEach(obj => createObjectRuntime(obj));
      rebuildHierarchyOrder();
      focusedObjectId = hierarchyOrderCache.length ? hierarchyOrderCache[0].id : null;
    } else {
      buildDefaultSolarSystem();
    }

    // Every frame: walk the hierarchy root-first, integrating each object's
    // orbit around its *already-positioned* parent and summing into an
    // absolute world position — the mechanism that turns "nested by mass"
    // into actual compound motion (a moon looping around a moving planet).
    function updateObjectsPhysics(delta) {
      hierarchyOrderCache.forEach(obj => {
        const rt = objectRuntime.get(obj.id);
        if (!rt) return;
        const parentRt = obj.parentId ? objectRuntime.get(obj.parentId) : null;
        if (!parentRt) {
          rt.absX = 0; rt.absY = 0; rt.absZ = 0;
        } else {
          if (rt.gState) integrateGravity(rt.gState, delta, Math.max(0.5, parentRt.config.mass));
          rt.absX = parentRt.absX + (rt.gState ? rt.gState.x : 0);
          rt.absY = parentRt.absY;
          rt.absZ = parentRt.absZ + (rt.gState ? rt.gState.z : 0);
        }
        rt.root.position.set(rt.absX, rt.absY, rt.absZ);
        if (rt.gState && parentRt) rt.root.lookAt(parentRt.absX, parentRt.absY, parentRt.absZ);
        // The path line's shape is fixed (see rebuildOrbitPathLine), but
        // its parent may itself be moving — keep it centered live.
        const pathLine = orbitPathLines.get(obj.id);
        if (pathLine && parentRt) pathLine.position.set(parentRt.absX, parentRt.absY, parentRt.absZ);
      });
    }

    // --- Manual Camera Controls (mouse drag / touch drag, wheel / pinch zoom) ---
    // Registered unconditionally so the gesture handlers are always attached;
    // `controls.enabled` gates whether they actually move the camera, since
    // the auto-tracking modes below drive camera.position/lookAt themselves.
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 2;
    controls.maxDistance = 1200;
    controls.target.set(0, 0, 0);
    controls.enabled = params.camera.trackingMode === 'Manual Control'; // respects a loaded program
    controls.update();

    // --- Entity Selection (double-click / double-tap) ---
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let selectionHelper = null;
    let selectedEntity = null;

    // Built detached here (rather than looked up via getElementById from
    // static HTML) and appended into the Objects panel's body once that
    // panel exists further down — same DOM nodes either way, just built
    // where the code that drives them lives instead of a separate markup
    // block, matching how every other HUD control is already constructed.
    const selectionBar = el('div', 'lcars-hud__selection');
    selectionBar.hidden = true;
    selectionBar.appendChild(el('span', 'lcars-hud__selection-label', 'SEL'));
    const selectionValueEl = el('span', 'lcars-hud__selection-value', '—');
    selectionBar.appendChild(selectionValueEl);
    const selectionClearBtn = document.createElement('button');
    selectionClearBtn.type = 'button';
    selectionClearBtn.className = 'lcars-hud__selection-clear';
    selectionClearBtn.setAttribute('aria-label', 'Clear selection');
    selectionClearBtn.textContent = '✕';
    selectionBar.appendChild(selectionClearBtn);

    function selectableTargets() {
      const targets = [];
      objectRuntime.forEach(rt => targets.push(...rt.allMeshes));
      return targets;
    }

    // Map a raw raycast hit back to the logical object it belongs to —
    // every sub-mesh of a composite shape (Starship, Custom) maps to the
    // same object id, so clicking any part selects the whole thing.
    function resolveEntity(mesh) {
      const id = meshToObjectId.get(mesh);
      if (!id) return null;
      const obj = params.objects.find(o => o.id === id);
      const rt = objectRuntime.get(id);
      if (!obj || !rt) return null;
      return { root: rt.root, label: objectDisplayName(obj), objectId: id };
    }

    function setSelection(entity) {
      clearSelection();
      selectedEntity = entity.root;
      selectedObjectId = entity.objectId;
      selectionHelper = new THREE.BoxHelper(entity.root, hexToNum(LCARS_PALETTE.alert));
      scene.add(selectionHelper);
      selectionValueEl.textContent = entity.label;
      selectionBar.hidden = false;
      // In Manual Control mode, re-center orbiting on whatever was just selected
      if (controls.enabled) {
        const targetPos = new THREE.Vector3();
        entity.root.getWorldPosition(targetPos);
        controls.target.copy(targetPos);
      }
      // Selecting in the 3D scene also focuses that object's controls and
      // opens the Objects panel, even if it was collapsed at the time.
      if (entity.objectId) {
        focusedObjectId = entity.objectId;
        if (typeof renderObjectsTab === 'function') renderObjectsTab();
        if (typeof objectsPanel !== 'undefined' && objectsPanel) objectsPanel.setOpen(true);
      }
    }

    function clearSelection() {
      if (selectionHelper) {
        scene.remove(selectionHelper);
        selectionHelper.geometry.dispose();
        selectionHelper.material.dispose();
        selectionHelper = null;
      }
      selectedEntity = null;
      selectedObjectId = null;
      selectionBar.hidden = true;
    }

    function handleActivateAt(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);

      const hits = raycaster.intersectObjects(selectableTargets(), false);
      if (hits.length === 0) {
        if (selectedEntity) playDismiss();
        clearSelection();
        return;
      }
      const entity = resolveEntity(hits[0].object);
      if (!entity) {
        if (selectedEntity) playDismiss();
        clearSelection();
        return;
      }
      // Double-tapping the already-selected entity deselects it
      if (selectedEntity === entity.root) {
        playDismiss();
        clearSelection();
      } else {
        setSelection(entity);
        playConfirm();
      }
    }

    selectionClearBtn.addEventListener('click', () => {
      if (selectedEntity) playDismiss();
      clearSelection();
    });

    // --- Living-system telemetry (purely decorative except the orbital
    // readout) --- A stardate ticker in the Camera header — doesn't mean
    // anything, exists so the HUD reads as a system that's alive. Runs
    // continuously now that the corner panels' headers (and thus this
    // readout) are always on screen, open or collapsed.
    const stardateEl = el('span', 'lcars-hud__bar-stardate');
    stardateEl.setAttribute('aria-hidden', 'true');

    function computeStardate() {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 0);
      const dayOfYear = Math.floor((now - startOfYear) / 86400000);
      const secondsToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const whole = 47000 + (now.getFullYear() - 2024) * 1000 + Math.floor(dayOfYear * 2.7);
      const frac = (secondsToday % 100).toString().padStart(2, '0');
      return 'SD ' + whole + '.' + frac;
    }

    // Keeps the focused object's Orbital Telemetry panel (if the Objects
    // panel is actually open right now) reading live current values —
    // piggybacked on this existing 1s ticker instead of a dedicated timer
    // or a per-frame DOM write. A no-op whenever there's nothing relevant
    // to update, so it's always safe to call unconditionally.
    function updateOrbitalTelemetryReadout() {
      if (!objectsPanel || !objectsPanel.isOpen()) return;
      const obj = params.objects.find(o => o.id === focusedObjectId);
      if (!obj || !obj.parentId) return;
      const rt = objectRuntime.get(obj.id);
      const parentRt = objectRuntime.get(obj.parentId);
      if (!rt || !parentRt) return;
      const mu = Math.max(0.5, parentRt.config.mass);
      const elements = computeOrbitElements(mu, obj.orbit.distance, obj.orbit.angleDeg, obj.orbit.speedRatio);
      const dist = rt.gState ? Math.hypot(rt.gState.x, rt.gState.z) : obj.orbit.distance;
      const speed = rt.gState ? Math.hypot(rt.gState.vx, rt.gState.vz) : 0;
      const setField = (key, text) => {
        const fieldEl = document.querySelector('[data-telemetry="' + key + '"]');
        if (fieldEl) fieldEl.textContent = text;
      };
      setField('period', elements.period !== null ? elements.period.toFixed(1) + ' s' : 'UNBOUND');
      setField('speed', speed.toFixed(2) + ' u/s');
      setField('distance', dist.toFixed(1) + ' u');
      setField('eccentricity', elements.e.toFixed(3));
    }

    stardateEl.textContent = computeStardate();
    setInterval(() => {
      stardateEl.textContent = computeStardate();
      updateOrbitalTelemetryReadout();
    }, 1000);

    // --- Double-tap/double-click to select an object in the 3D scene ---
    const DOUBLE_TAP_MS = 350;
    const DOUBLE_TAP_PX = 28;

    function watchDoubleActivate(el, onDoubleActivate) {
      let last = { time: 0, x: 0, y: 0, pointerType: '' };
      el.addEventListener('pointerup', (e) => {
        const now = performance.now();
        const dx = e.clientX - last.x;
        const dy = e.clientY - last.y;
        const isDouble =
          (now - last.time) < DOUBLE_TAP_MS &&
          Math.hypot(dx, dy) < DOUBLE_TAP_PX &&
          e.pointerType === last.pointerType;

        if (isDouble) {
          onDoubleActivate(e);
          last.time = 0;
        } else {
          last = { time: now, x: e.clientX, y: e.clientY, pointerType: e.pointerType };
        }
      });
    }

    watchDoubleActivate(renderer.domElement, (e) => {
      handleActivateAt(e.clientX, e.clientY);
    });

    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

    // --- Interaction Audio (synthesized, muted by default) ---
    // Never plays on page load — only ever invoked from inside a click/key
    // event handler, which is exactly what the browser autoplay policy
    // requires anyway. No audio files: a handful of short Web Audio
    // oscillator blips instead, kept deliberately quiet and few in number.
    let audioCtx = null;
    let audioEnabled = false;

    function ensureAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playBlip(freqStart, freqEnd, duration, volume) {
      if (!audioEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), ctx.currentTime + duration);
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    function playTick() { playBlip(880, 1100, 0.06, 0.05); }
    function playConfirm() { playBlip(660, 990, 0.09, 0.06); }
    function playDismiss() { playBlip(990, 660, 0.09, 0.06); }
    function playOpen() { playBlip(520, 1040, 0.12, 0.06); }

    const audioToggleBtn = document.createElement('button');
    audioToggleBtn.type = 'button';
    audioToggleBtn.className = 'lcars-hud__audio-toggle';
    audioToggleBtn.setAttribute('aria-pressed', 'false');
    audioToggleBtn.setAttribute('aria-label', 'Toggle interface sound');
    const audioDot = document.createElement('span');
    audioDot.className = 'lcars-hud__audio-dot';
    audioToggleBtn.appendChild(audioDot);
    audioToggleBtn.appendChild(document.createTextNode('SND'));
    audioToggleBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      audioToggleBtn.setAttribute('aria-pressed', audioEnabled ? 'true' : 'false');
      if (audioEnabled) {
        ensureAudioContext();
        playTick();
      }
    });

    // --- LCARS HUD: element builders ---
    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    // Every panel's visible title doubles as its control's accessible name
    // via aria-labelledby, instead of a separately-typed aria-label string
    // that could drift out of sync with what's on screen. panelIdCounter
    // guarantees a unique id per panel across the whole HUD.
    let panelIdCounter = 0;

    function panelHeader(code, title) {
      const titleId = 'lcars-label-' + (panelIdCounter++);
      const header = el('div', 'lcars-panel__header');
      const titleSpan = el('span', null, title);
      titleSpan.id = titleId;
      header.appendChild(titleSpan);
      header.appendChild(el('span', 'lcars-panel__code', code));
      return { headerEl: header, titleId };
    }

    function createSliderPanel(container, opts) {
      const format = opts.format || (v => v);
      const valueText = v => String(format(v)) + (opts.unit ? ' ' + opts.unit : '');
      const panel = el('div', 'lcars-panel' + (opts.sub ? ' lcars-panel--sub' : ''));
      if (opts.visible === false) panel.style.display = 'none';
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const valueEl = el('div', 'tool-value', format(opts.value));
      if (opts.unit) valueEl.appendChild(el('span', 'tool-value__unit', opts.unit));
      panel.appendChild(valueEl);

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'tool-slider';
      slider.min = opts.min;
      slider.max = opts.max;
      slider.step = opts.step;
      slider.value = opts.value;
      slider.setAttribute('aria-labelledby', titleId);
      slider.setAttribute('aria-valuetext', valueText(opts.value));
      slider.addEventListener('input', () => {
        const v = parseFloat(slider.value);
        valueEl.childNodes[0].textContent = format(v);
        slider.setAttribute('aria-valuetext', valueText(v));
        opts.onInput(v);
      });
      panel.appendChild(slider);

      container.appendChild(panel);
      return {
        refresh(v) {
          slider.value = v;
          valueEl.childNodes[0].textContent = format(v);
          slider.setAttribute('aria-valuetext', valueText(v));
        },
        setVisible(v) { panel.style.display = v ? '' : 'none'; }
      };
    }

    function createTogglePanel(container, opts) {
      const onLabel = opts.onLabel || 'ENABLED';
      const offLabel = opts.offLabel || 'DISABLED';
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const row = el('div', 'tool-toggle-row');
      const valueEl = el('div', 'tool-value tool-value--text', opts.value ? onLabel : offLabel);
      const toggle = document.createElement('input');
      toggle.type = 'checkbox';
      toggle.className = 'tool-toggle';
      toggle.checked = opts.value;
      toggle.setAttribute('aria-labelledby', titleId);
      toggle.addEventListener('change', () => {
        playTick();
        valueEl.textContent = toggle.checked ? onLabel : offLabel;
        opts.onChange(toggle.checked);
      });
      row.appendChild(valueEl);
      row.appendChild(toggle);
      panel.appendChild(row);

      container.appendChild(panel);
      return {
        refresh(v) {
          toggle.checked = v;
          valueEl.textContent = v ? onLabel : offLabel;
        }
      };
    }

    function createSelectPanel(container, opts) {
      const labels = opts.labels || {};
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const valueEl = el('div', 'tool-value tool-value--text', labels[opts.value] || opts.value);
      panel.appendChild(valueEl);

      const optsRow = el('div', 'tool-select');
      optsRow.setAttribute('role', 'group');
      optsRow.setAttribute('aria-labelledby', titleId);
      const buttons = opts.options.map(optVal => {
        const btn = el('button', 'tool-select__opt' + (optVal === opts.value ? ' is-active' : ''), labels[optVal] || optVal);
        btn.type = 'button';
        btn.dataset.value = optVal;
        btn.setAttribute('aria-pressed', optVal === opts.value ? 'true' : 'false');
        btn.addEventListener('click', () => {
          playTick();
          buttons.forEach(b => {
            b.classList.remove('is-active');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('is-active');
          btn.setAttribute('aria-pressed', 'true');
          valueEl.textContent = labels[optVal] || optVal;
          opts.onChange(optVal);
        });
        optsRow.appendChild(btn);
        return btn;
      });
      panel.appendChild(optsRow);

      container.appendChild(panel);
      return {
        refresh(v) {
          valueEl.textContent = labels[v] || v;
          buttons.forEach(b => {
            const active = b.dataset.value === v;
            b.classList.toggle('is-active', active);
            b.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
        },
        setVisible(v) { panel.style.display = v ? '' : 'none'; }
      };
    }

    function createColorPanel(container, opts) {
      const panel = el('div', 'lcars-panel');
      if (opts.visible === false) panel.style.display = 'none';
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const row = el('div', 'tool-color-row');
      const valueEl = el('div', 'tool-value tool-value--text', opts.value.toUpperCase());
      const swatch = document.createElement('input');
      swatch.type = 'color';
      swatch.className = 'tool-color-swatch';
      swatch.value = opts.value;
      swatch.setAttribute('aria-labelledby', titleId);
      swatch.addEventListener('input', () => {
        valueEl.textContent = swatch.value.toUpperCase();
        opts.onChange(swatch.value);
      });
      row.appendChild(swatch);
      row.appendChild(valueEl);
      panel.appendChild(row);

      container.appendChild(panel);
      return {
        refresh(v) {
          swatch.value = v;
          valueEl.textContent = v.toUpperCase();
        },
        setVisible(v) { panel.style.display = v ? '' : 'none'; }
      };
    }

    function createFilePanel(container, opts) {
      const panel = el('div', 'lcars-panel');
      panel.style.display = opts.visible ? '' : 'none';
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const valueEl = el('div', 'tool-value tool-value--text', opts.value || 'NO FILE LOADED');
      panel.appendChild(valueEl);

      const input = document.createElement('input');
      input.type = 'file';
      input.className = 'tool-file';
      if (opts.accept) input.accept = opts.accept;
      input.setAttribute('aria-labelledby', titleId);
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (file) {
          playTick();
          valueEl.textContent = file.name.toUpperCase();
          opts.onChange(file);
        }
      });
      panel.appendChild(input);

      container.appendChild(panel);
      return {
        setVisible(v) { panel.style.display = v ? '' : 'none'; },
        refresh(v) { valueEl.textContent = v; }
      };
    }

    // A simple free-text field — used for an object's Name, the one control
    // that doesn't fit slider/toggle/select/color/file.
    function createTextFieldPanel(container, opts) {
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'tool-text-input';
      input.style.width = '100%';
      input.style.boxSizing = 'border-box';
      input.style.marginTop = '6px';
      input.value = opts.value;
      input.maxLength = 40;
      input.setAttribute('aria-labelledby', titleId);
      const commit = () => {
        const v = input.value.trim();
        opts.onChange(v || opts.value);
      };
      input.addEventListener('change', commit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
      panel.appendChild(input);

      container.appendChild(panel);
    }

    // --- LCARS HUD: four independent corner panels ---
    // Mike Okuda's redesign: rather than one mega-panel with internal tabs,
    // each control category is its own small panel pinned to a screen
    // corner, opened/closed independently of the others. Objects (what to
    // build) and Appearance (how it looks) share the left edge; Camera
    // (how you're looking at it) and Files (save/load/export) share the
    // right — grouped by "who reaches for this together," not by leftover
    // tab order.
    const ALL_CORNER_PANELS = [];

    function createCornerPanel(config) {
      // config: { id, corner: 'tl'|'tr'|'bl'|'br', label, accent }
      const panel = el('div', 'lcars-corner-panel lcars-corner-panel--' + config.corner);
      panel.style.setProperty('--accent', config.accent);

      const headerRow = el('div', 'lcars-corner-header');
      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = 'lcars-corner-toggle';
      const bodyId = 'lcars-corner-body-' + config.id;
      toggleBtn.setAttribute('aria-expanded', 'false');
      toggleBtn.setAttribute('aria-controls', bodyId);
      toggleBtn.textContent = config.label;
      headerRow.appendChild(toggleBtn);

      const body = el('div', 'lcars-corner-body');
      body.id = bodyId;

      panel.appendChild(headerRow);
      panel.appendChild(body);
      document.body.appendChild(panel);

      let open = false;
      function setOpen(v) {
        if (open === v) return;
        open = v;
        panel.classList.toggle('is-open', v);
        toggleBtn.setAttribute('aria-expanded', v ? 'true' : 'false');
        if (v) playOpen(); else playDismiss(); // no-ops silently while audio is off
      }
      toggleBtn.addEventListener('click', () => setOpen(!open));

      const instance = { panel, headerRow, toggleBtn, body, setOpen, isOpen: () => open };
