<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>8-Cube Occlusion Construct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* LCARS design tokens. Mirrored in JS as LCARS_PALETTE, which is the
       actual source of truth — it pushes these same values in here via
       setProperty() at startup, and reuses them for the 3D scene (selection
       highlight, path markers) so the chrome and the construct itself read
       as one consistent color system instead of two coincidentally-similar
       palettes. The literals below are just the pre-JS fallback. */
    :root {
      --lcars-butterscotch: #ff9c00;
      --lcars-african-violet: #cc99cc;
      --lcars-periwinkle: #9999ff;
      --lcars-gold: #ffcc66;
      --lcars-mars: #ff6666;
      --lcars-ice: #66ccff;
      --lcars-salmon: #ff9977;
      --lcars-plum: #cc6699;
      --lcars-alert: #33ffff;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: monospace;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      /* Hand every touch gesture (drag-orbit, pinch-zoom) to OrbitControls
         instead of letting the browser scroll/zoom the page with it. */
      touch-action: none;
    }
    /* --- LCARS HUD --- */
    /* Closed by default: summoned with a double-tap/double-click anywhere in
       the scene, dismissed with a double-tap/double-click anywhere on it.
       The frame is built from four flat, opaque blocks laid out on a grid —
       a header bar, a corner cap, a category-colored spine, and the body —
       instead of one translucent rounded card. No blur, no gradients, no
       drop shadows: LCARS was flat design before "flat design" had a name. */
    .lcars-hud {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 348px;
      max-height: calc(100vh - 40px);
      display: none;
      grid-template-columns: 1fr 26px;
      grid-template-rows: 46px 1fr;
      grid-template-areas:
        "bar  cap"
        "body spine";
      gap: 3px; /* the black "grout" seam between blocks */
      background: #000;
      color: #e8e8e8;
      font-family: 'Antonio', 'Arial Narrow', sans-serif;
      z-index: 20;
      overflow: hidden;
      /* Menu stays finger-friendly: taps register instantly and double-tap
         never triggers the browser's page-zoom gesture. */
      touch-action: manipulation;
    }

    .lcars-hud.is-open { display: grid; }

    /* The elbow: header bar + spine meeting a swept corner cap. Sharp on the
       two outer corners that align with the screen edge, one big radius on
       the inner corner facing the content — LCARS's signature joint. */
    .lcars-hud__bar {
      grid-area: bar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--lcars-butterscotch);
      color: #000;
    }

    .lcars-hud__bar-label {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .lcars-hud__bar-code {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .lcars-hud__bar-code-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lcars-hud__bar-stardate {
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    /* A quiet "system is alive" pulse — purely decorative */
    .lcars-hud__pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #000;
      animation: lcars-pulse 2.4s ease-in-out infinite;
    }

    @keyframes lcars-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* Muted by default — this is the only way interface sound turns on */
    .lcars-hud__audio-toggle {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      appearance: none;
      -webkit-appearance: none;
      margin: 0 8px;
      padding: 3px 8px;
      font-family: inherit;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(0, 0, 0, 0.55);
      background: rgba(0, 0, 0, 0.12);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .lcars-hud__audio-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
    }

    .lcars-hud__audio-toggle[aria-pressed="true"] {
      color: #000;
      background: rgba(0, 0, 0, 0.25);
    }

    .lcars-hud__audio-toggle[aria-pressed="true"] .lcars-hud__audio-dot {
      background: #000;
    }

    .lcars-hud__cap {
      grid-area: cap;
      background: var(--lcars-butterscotch);
      border-radius: 2px 2px 2px 999px;
    }

    /* Tracks the active tab's color — a live "you are here" wayfinding cue.
       Also carries a few flavor readouts: purely cosmetic telemetry that
       reads as "living system" without meaning anything or asking for
       any attention — never focusable, never announced to assistive tech. */
    .lcars-hud__spine {
      grid-area: spine;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 12px 0;
      background: var(--spine-accent, var(--lcars-butterscotch));
      transition: background 0.2s;
    }

    .lcars-hud__tick {
      writing-mode: vertical-rl;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(0, 0, 0, 0.5);
      font-variant-numeric: tabular-nums;
    }

    .lcars-hud__body {
      grid-area: body;
      min-height: 0; /* let this grid item shrink so its own child can scroll */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
    }

    .lcars-hud-hint {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      appearance: none;
      -webkit-appearance: none;
      border: none;
      font-family: 'Antonio', 'Arial Narrow', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #000;
      background: var(--lcars-butterscotch);
      border-radius: 2px 2px 2px 20px; /* echoes the cap's sweep, closed-state preview */
      z-index: 20;
      cursor: pointer;
    }

    .lcars-hud-hint[hidden] { display: none; }

    .lcars-hud__selection {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--lcars-alert);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .lcars-hud__selection[hidden] { display: none; }

    .lcars-hud__selection-label { color: #000; }

    .lcars-hud__selection-value {
      flex: 1;
      overflow: hidden;
      color: #000;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .lcars-hud__selection-clear {
      width: 22px;
      height: 22px;
      font-family: inherit;
      font-size: 11px;
      line-height: 1;
      color: #000;
      background: rgba(0, 0, 0, 0.15);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .lcars-hud__selection-clear:hover { background: rgba(0, 0, 0, 0.3); }

    .lcars-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      padding: 10px 10px 8px;
      background: #000;
    }

    .lcars-tab {
      flex: 1 1 auto;
      min-width: 72px;
      text-align: center;
      padding: 7px 8px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--tab-accent, #999);
      background: var(--tab-accent-dim, rgba(255, 255, 255, 0.06));
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .lcars-tab:hover { filter: brightness(1.3); }

    .lcars-tab.is-active {
      background: var(--tab-accent, #ff9c00);
      color: #000;
      font-weight: 700;
    }

    .lcars-tabpanels {
      padding: 12px;
      overflow-y: auto;
      background: #000;
    }

    .lcars-tabpanel {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .lcars-tabpanel.is-active { display: flex; }

    .lcars-panel {
      background: #0d0d0d;
      border-left: 4px solid var(--accent, #ff9c00);
      border-radius: 3px 14px 14px 3px;
      padding: 0 12px 10px;
      overflow: hidden; /* clips the header chip's bleed to this panel's own rounded corners */
    }

    .lcars-panel--sub { margin-left: 14px; }

    .lcars-panel__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 -12px 8px; /* bleed edge-to-edge, cancelling the panel's own side padding */
      padding: 5px 12px;
      background: var(--accent, #ff9c00);
      color: #000;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .lcars-panel__code {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: rgba(0, 0, 0, 0.55);
    }

    .tool-value {
      margin: 4px 0 6px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }

    .tool-value--text {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .tool-value__unit {
      margin-left: 4px;
      font-size: 11px;
      opacity: 0.55;
    }

    .tool-slider {
      width: 100%;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .tool-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, #ff9c00);
      border: 2px solid #000;
      cursor: pointer;
    }

    .tool-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent, #ff9c00);
      border: 2px solid #000;
      cursor: pointer;
    }

    .tool-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tool-toggle {
      position: relative;
      width: 40px;
      height: 20px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      transition: background 0.15s;
    }

    .tool-toggle:checked { background: var(--accent, #ff9c00); }

    .tool-toggle::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #000;
      transition: transform 0.15s;
    }

    .tool-toggle:checked::before { transform: translateX(20px); }

    .tool-select {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tool-select__opt {
      flex: 1 1 auto;
      padding: 5px 8px;
      font-family: inherit;
      font-size: 10px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .tool-select__opt.is-active {
      background: var(--accent, #ff9c00);
      color: #000;
      font-weight: bold;
    }

    .tool-color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .tool-color-swatch {
      width: 34px;
      height: 26px;
      padding: 0;
      background: none;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
    }

    .tool-file {
      width: 100%;
      margin-top: 6px;
      font-family: inherit;
      font-size: 10px;
      color: #aaa;
    }

    .tool-file::file-selector-button {
      padding: 5px 10px;
      margin-right: 8px;
      font-family: inherit;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #000;
      background: var(--accent, #ff9c00);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .tool-text-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .tool-text-input {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .tool-text-input::placeholder { color: rgba(255, 255, 255, 0.35); }

    .tool-text-button {
      padding: 6px 14px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #000;
      background: var(--accent, #ff9c00);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tool-text-button:hover { filter: brightness(1.15); }

    .tool-textarea {
      box-sizing: border-box;
      width: 100%;
      height: 60px;
      margin-top: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 10px;
      color: #ccc;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      resize: vertical;
    }

    .tool-program-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .tool-program-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }

    .tool-program-name {
      flex: 1;
      overflow: hidden;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: #fff;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool-program-load {
      padding: 4px 10px;
      font-family: inherit;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: #000;
      background: var(--accent, #ff9c00);
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .tool-program-delete {
      width: 20px;
      height: 20px;
      font-size: 10px;
      line-height: 1;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .tool-program-delete:hover { background: rgba(255, 255, 255, 0.25); }

    .tool-program-empty {
      padding: 6px 4px;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
    }

    /* One consistent themed focus ring for every keyboard-reachable control,
       instead of leaving it to inconsistent browser defaults — and restoring
       it where .tool-slider/.tool-toggle removed the native outline entirely. */
    .lcars-hud-hint:focus-visible,
    .lcars-tab:focus-visible,
    .tool-slider:focus-visible,
    .tool-toggle:focus-visible,
    .tool-select__opt:focus-visible,
    .tool-color-swatch:focus-visible,
    .tool-file:focus-visible,
    .tool-text-input:focus-visible,
    .tool-text-button:focus-visible,
    .tool-program-load:focus-visible,
    .tool-program-delete:focus-visible,
    .tool-textarea:focus-visible,
    .lcars-hud__selection-clear:focus-visible,
    .lcars-hud__audio-toggle:focus-visible {
      outline: 2px solid var(--lcars-alert);
      outline-offset: 2px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <button type="button" class="lcars-hud-hint" id="lcars-hud-hint" aria-label="Open control menu">HUD-01 · double-tap to open</button>

  <div class="lcars-hud" id="lcars-hud">
    <div class="lcars-hud__bar">
      <span class="lcars-hud__bar-label">Controls</span>
      <button type="button" class="lcars-hud__audio-toggle" id="lcars-audio-toggle" aria-pressed="false" aria-label="Toggle interface sound">
        <span class="lcars-hud__audio-dot" aria-hidden="true"></span>
        SND
      </button>
      <span class="lcars-hud__bar-code" aria-hidden="true">
        <span class="lcars-hud__bar-code-row">
          <span class="lcars-hud__pulse"></span>
          HUD-01
        </span>
        <span class="lcars-hud__bar-stardate" id="lcars-stardate">SD 47000.00</span>
      </span>
    </div>
    <div class="lcars-hud__cap"></div>
    <div class="lcars-hud__body">
      <div class="lcars-hud__selection" id="lcars-selection" hidden>
        <span class="lcars-hud__selection-label">SEL</span>
        <span class="lcars-hud__selection-value" id="lcars-selection-value">—</span>
        <button class="lcars-hud__selection-clear" id="lcars-selection-clear" type="button" aria-label="Clear selection">✕</button>
      </div>
      <nav class="lcars-menu" id="lcars-menu"></nav>
      <div class="lcars-tabpanels" id="lcars-tabpanels"></div>
    </div>
    <div class="lcars-hud__spine" aria-hidden="true">
      <span class="lcars-hud__tick"></span>
      <span class="lcars-hud__tick"></span>
      <span class="lcars-hud__tick"></span>
      <span class="lcars-hud__tick"></span>
    </div>
  </div>

  <script>
    // --- Application State & Parameters ---
    const params = {
      // Surface Colors (Strict 3-tone or custom)
      surfaceColors: {
        preset: 'Default (Black/Grey/White)',
        inwardFace: '#ffffff',   // facing center
        outwardFace: '#000000',  // facing away
        parallelFaces: '#808080' // parallel to horizon & sides
      },
      // Orbit & Central Cog
      orbit: {
        radius: 35,
        speed: 0.25,
        count: 8,
        cogSize: 1.0
      },
      // Orbiting Cubes Dimension
      cube: {
        sizeX: 6,
        sizeY: 6,
        sizeZ: 6,
        proportionalLock: true,
        uniformScale: 6
      },
      // Central Light Source
      source: {
        color: '#ffffff',
        intensity: 2.0,
        size: 1.5,
        distance: 120,
        decay: 1.0
      },
      // Runner
      runner: {
        shape: 'Rectifier',
        size: 0.8,
        path: {
          // World-space waypoints the runner travels between. Always at
          // least 2 (start, end); "Path Nodes" inserts more in between.
          nodes: [
            { x: 0, y: 0, z: 60 }, // start
            { x: 0, y: 0, z: 0 }   // end
          ],
          mode: 'Loop',    // 'Loop' | 'Play Once' | 'Boomerang'
          corner: 'Square' // 'Square' | 'Round'
        },
        speed: 12.0,
        color: '#000000',
        active: true
      },
      // Camera Controls
      camera: {
        fov: 50,
        trackingMode: 'Runner Tracking',
        distance: 12,
        height: 3.5
      },
      // World: the shared reference frame Floor and Sky are both anchored
      // to, plus Floor & Sky themselves (identical option shape). Defaults
      // reproduce the original hardcoded floor exactly, and default the
      // sky to invisible, so the scene looks unchanged until touched.
      world: {
        alignment: 'Cube', // 'Source' | 'Cube' | 'XYZ'
        offset: { x: 0, y: 0, z: 0 }, // used only when alignment is 'XYZ'
        // Floor and sky always share one geometry — changing it snaps both
        // at once, so the two never end up as mismatched shapes.
        geometry: 'Square' // 'Square' | 'Radial' | 'Hemisphere' | 'Cube'
      },
      floor: {
        size: 300,
        surface: 'Color',     // 'Off' | 'Color' | 'Grid' | 'Image'
        color: '#111111',
        gridFrequency: 10,
        gridSize: 2
      },
      sky: {
        size: 400,
        surface: 'Off',
        color: '#0a0a1a',
        gridFrequency: 10,
        gridSize: 2
      }
    };

    // --- Memory: Save/Load Programs (persistence) ---
    // `params` is fully JSON-safe — plain values, arrays, nested plain
    // objects, no functions or circular refs — so a snapshot is just a
    // stringify. Loading works by writing the chosen snapshot into a
    // "pending load" slot and reloading the page: the very first thing this
    // script does on the next run (right here, before any 3D object or HUD
    // control is built) is merge that snapshot onto the defaults above. That
    // means every panel's *initial* value already reflects the loaded
    // program — no separate "refresh every control" step needed anywhere.
    // Uploaded custom runner models and floor/sky images aren't captured
    // (their raw file bytes never touch `params`), so loading a program that
    // used one falls back to that shape/surface's normal placeholder, same
    // as picking it fresh without a file — never a crash, just a re-upload prompt.
    const MEMORY_KEY = 'eclipseStimulator.savedPrograms';
    const PENDING_LOAD_KEY = 'eclipseStimulator.pendingLoad';

    function safeLocalStorageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeLocalStorageSet(key, value) {
      try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
    }
    function safeLocalStorageRemove(key) {
      try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
    }

    function deepMerge(target, source) {
      Object.keys(source).forEach(key => {
        const value = source[key];
        if (Array.isArray(value)) {
          target[key] = value;
        } else if (value && typeof value === 'object') {
          if (!target[key] || typeof target[key] !== 'object') target[key] = {};
          deepMerge(target[key], value);
        } else {
          target[key] = value;
        }
      });
      return target;
    }

    (function applyPendingLoad() {
      let pending = null;
      try {
        pending = JSON.parse(safeLocalStorageGet(PENDING_LOAD_KEY) || 'null');
      } catch (e) {
        pending = null;
      }
      if (!pending) return;
      safeLocalStorageRemove(PENDING_LOAD_KEY);
      deepMerge(params, pending);
    })();

    function snapshotParams() {
      return JSON.parse(JSON.stringify(params));
    }

    function listPrograms() {
      const raw = safeLocalStorageGet(MEMORY_KEY);
      if (!raw) return {};
      try { return JSON.parse(raw); } catch (e) { return {}; }
    }

    function saveProgram(name) {
      const programs = listPrograms();
      programs[name] = snapshotParams();
      return safeLocalStorageSet(MEMORY_KEY, JSON.stringify(programs));
    }

    function deleteProgram(name) {
      const programs = listPrograms();
      delete programs[name];
      return safeLocalStorageSet(MEMORY_KEY, JSON.stringify(programs));
    }

    function loadProgram(name) {
      const programs = listPrograms();
      if (!programs[name]) return false;
      if (!safeLocalStorageSet(PENDING_LOAD_KEY, JSON.stringify(programs[name]))) return false;
      location.reload();
      return true;
    }

    // Base64 JSON, safe to paste into a text field. unescape/encodeURIComponent
    // is the standard trick for letting btoa/atob round-trip UTF-8, not just Latin-1.
    function exportProgramCode(snapshot) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(snapshot))));
    }

    function importProgramFromCode(code) {
      try {
        return JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      } catch (e) {
        return null;
      }
    }

    // --- LCARS Design Tokens ---
    // One named palette, reused everywhere a "which category is this"
    // color decision gets made — the tab accents, the selection highlight,
    // and the 3D path markers all read from here instead of each carrying
    // its own coincidentally-similar hex literal. Pushed onto :root as CSS
    // custom properties so the static chrome (hint pill, HUD title,
    // selection bar) consumes the exact same values as the JS-built tabs.
    const LCARS_PALETTE = {
      butterscotch: '#ff9c00',  // Source tab + summon hint
      africanViolet: '#cc99cc', // Orbit tab
      periwinkle: '#9999ff',    // Cube tab
      gold: '#ffcc66',          // Surface tab + intermediate path nodes
      mars: '#ff6666',          // Runner tab + path endpoints
      ice: '#66ccff',           // Camera tab
      salmon: '#ff9977',        // World tab (floor & sky)
      plum: '#cc6699',          // Memory tab (save/load)
      alert: '#33ffff'          // Selection highlight + path preview line
    };

    function hexToNum(hex) {
      return parseInt(hex.replace('#', ''), 16);
    }

    // A near-black tint of a palette color, used for the inactive-tab
    // background so even unselected categories hint at their own color
    // instead of falling back to generic gray.
    function dimHex(hex, blackMix) {
      const n = hexToNum(hex);
      const keep = 1 - blackMix;
      const toHex = v => Math.round(v * keep).toString(16).padStart(2, '0');
      return '#' + toHex((n >> 16) & 255) + toHex((n >> 8) & 255) + toHex(n & 255);
    }

    Object.entries(LCARS_PALETTE).forEach(([name, hex]) => {
      const cssVar = '--lcars-' + name.replace(/([A-Z])/g, '-$1').toLowerCase();
      document.documentElement.style.setProperty(cssVar, hex);
    });

    // --- Scene, Renderer & Global References ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    const camera = new THREE.PerspectiveCamera(
      params.camera.fov,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- Central Light & Mesh ---
    const centralPointLight = new THREE.PointLight(
      params.source.color,
      params.source.intensity,
      params.source.distance,
      params.source.decay
    );
    centralPointLight.castShadow = true;
    centralPointLight.shadow.mapSize.width = 2048;
    centralPointLight.shadow.mapSize.height = 2048;
    centralPointLight.shadow.bias = -0.001;
    scene.add(centralPointLight);

    const sourceMeshGeo = new THREE.SphereGeometry(params.source.size, 32, 16);
    const sourceMeshMat = new THREE.MeshBasicMaterial({ color: params.source.color });
    const sourceMesh = new THREE.Mesh(sourceMeshGeo, sourceMeshMat);
    scene.add(sourceMesh);

    // Ambient fill to keep absolute non-lit areas legible if desired
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.05);
    scene.add(ambientLight);

    // --- Floor & Sky ---
    // Floor and sky share one option shape (geometry + surface) and are
    // built by the same code, just mirrored: floor sits at the construct's
    // ground level, sky wraps around/above it. `kind` is 'floor' or 'sky'
    // throughout this section.
    let floorMesh = null;
    let skyMesh = null;
    let floorImageTexture = null;
    let skyImageTexture = null;

    function groundConfig(kind) {
      return kind === 'sky' ? params.sky : params.floor;
    }

    // Where Floor and Sky are both anchored, per params.world.alignment:
    //   Source — the fixed point everything else is built around (origin)
    //   Cube   — derived from the orbiting cubes' current height (default,
    //            matches the construct's original hardcoded floor)
    //   XYZ    — fully manual, no dependency on any other entity
    function computeWorldAnchor() {
      switch (params.world.alignment) {
        case 'Source':
          return { x: 0, y: 0, z: 0 };
        case 'XYZ':
          return { x: params.world.offset.x, y: params.world.offset.y, z: params.world.offset.z };
        case 'Cube':
        default:
          return { x: 0, y: -params.cube.sizeY / 2, z: 0 };
      }
    }

    function buildGroundGeometry(type, size) {
      switch (type) {
        case 'Radial': return new THREE.CircleGeometry(size / 2, 64);
        case 'Hemisphere': return new THREE.SphereGeometry(size / 2, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2);
        case 'Cube': return new THREE.BoxGeometry(size, size, size);
        case 'Square':
        default: return new THREE.PlaneGeometry(size, size);
      }
    }

    // Draws a single tile's border into a small canvas and tiles it via
    // texture.repeat — works on curved geometry too, unlike a flat line
    // helper, so the same grid surface applies to a dome or a skybox. Used
    // for every geometry except Radial, whose disc UVs don't map onto a
    // repeating square tile sensibly (see buildRadialGridGroup below).
    function createGridTexture(color, lineWidthPx) {
      const res = 128;
      const canvas = document.createElement('canvas');
      canvas.width = res;
      canvas.height = res;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, res, res);
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidthPx;
      ctx.strokeRect(0, 0, res, res);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function buildSurfaceMaterial(config, isSky, imageTexture) {
      // Sky is viewed from inside (BackSide, like a skybox); floor is
      // viewed from above/outside (DoubleSide, cheap insurance either way).
      const side = isSky ? THREE.BackSide : THREE.DoubleSide;
      if (config.surface === 'Grid') {
        const tex = createGridTexture(config.color, config.gridSize);
        tex.repeat.set(config.gridFrequency, config.gridFrequency);
        return new THREE.MeshBasicMaterial({ map: tex, transparent: true, side });
      }
      if (config.surface === 'Image' && imageTexture) {
        return new THREE.MeshBasicMaterial({ map: imageTexture, side });
      }
      // 'Color', or 'Image' with nothing uploaded yet — same flat-color
      // fallback used by the runner's Custom shape before a model loads
      return new THREE.MeshLambertMaterial({ color: config.color, side });
    }

    // Y height for a flat (Square/Radial) surface, relative to the world
    // anchor — shared by the mesh itself and the radial grid overlay below
    // so the two always land on the same plane.
    function flatSurfaceY(anchor, config, isSky) {
      return isSky ? anchor.y + config.size * 0.6 : anchor.y;
    }

    function positionGroundMesh(mesh, config, isSky) {
      const anchor = computeWorldAnchor();
      switch (params.world.geometry) {
        case 'Hemisphere':
          // Floor: bowl opening upward (flip the dome). Sky: dome rising
          // from ground level, camera-friendly BackSide handles the inside view.
          mesh.rotation.x = isSky ? 0 : Math.PI;
          mesh.rotation.z = 0;
          mesh.position.set(anchor.x, anchor.y, anchor.z);
          break;
        case 'Cube':
          mesh.rotation.set(0, 0, 0);
          // Floor: top face at the anchor (a solid platform underneath).
          // Sky: box centered above, anchor to roof, enclosing the scene.
          mesh.position.set(anchor.x, isSky ? anchor.y + config.size / 2 : anchor.y - config.size / 2, anchor.z);
          break;
        case 'Square':
        case 'Radial':
        default:
          mesh.rotation.set(-Math.PI / 2, 0, 0);
          mesh.position.set(anchor.x, flatSurfaceY(anchor, config, isSky), anchor.z);
          break;
      }
    }

    // Radial + Grid gets its own exact geometry instead of a texture: a
    // disc's default UVs are a planar (not polar) projection, so tiling a
    // square-tile texture over it produces a warped, off-center pattern —
    // it conflicts with the shape instead of describing it. Building actual
    // concentric ring/spoke lines is exact at any radius and trivially
    // "centered on the origin" and "spoke aligned with Z" by construction:
    // in the (x, z) = (cos, sin) plane, angle 0 is +X and angle PI/2 is +Z,
    // so starting the spoke sweep at PI/2 puts the first spoke on the Z axis.
    function buildRadialGridGroup(config) {
      const ringCount = Math.max(1, Math.round(config.gridFrequency));
      const spokeCount = Math.max(1, Math.round(config.gridFrequency));
      const maxRadius = config.size / 2;
      const segments = 64;
      const material = new THREE.LineBasicMaterial({
        color: config.color,
        linewidth: config.gridSize,
        transparent: true,
        opacity: 0.7
      });

      const group = new THREE.Group();

      // Concentric rings, evenly spaced by radius
      for (let i = 1; i <= ringCount; i++) {
        const r = (i / ringCount) * maxRadius;
        const points = [];
        for (let s = 0; s <= segments; s++) {
          const a = (s / segments) * Math.PI * 2;
          points.push(new THREE.Vector3(r * Math.cos(a), 0, r * Math.sin(a)));
        }
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material));
      }

      // Radial spokes from center to edge, evenly spaced by angle, first one on +Z
      for (let j = 0; j < spokeCount; j++) {
        const a = Math.PI / 2 + j * ((Math.PI * 2) / spokeCount);
        const points = [
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(maxRadius * Math.cos(a), 0, maxRadius * Math.sin(a))
        ];
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material));
      }

      return group;
    }

    function positionRadialGridGroup(group, config, isSky) {
      const anchor = computeWorldAnchor();
      group.position.set(anchor.x, flatSurfaceY(anchor, config, isSky), anchor.z);
    }

    let floorRadialGrid = null;
    let skyRadialGrid = null;

    function disposeRadialGrid(kind) {
      const group = kind === 'sky' ? skyRadialGrid : floorRadialGrid;
      if (!group) return;
      scene.remove(group);
      const sharedMaterial = group.children[0] && group.children[0].material;
      group.children.forEach(line => line.geometry.dispose());
      if (sharedMaterial) sharedMaterial.dispose();
      if (kind === 'sky') skyRadialGrid = null; else floorRadialGrid = null;
    }

    function rebuildGroundMesh(kind) {
      const isSky = kind === 'sky';
      const config = groundConfig(kind);
      const old = isSky ? skyMesh : floorMesh;
      const persistentTex = isSky ? skyImageTexture : floorImageTexture;
      const isRadialGrid = params.world.geometry === 'Radial' && config.surface === 'Grid';

      if (old) {
        scene.remove(old);
        old.geometry.dispose();
        if (old.material.map && old.material.map !== persistentTex) old.material.map.dispose();
        old.material.dispose();
      }
      disposeRadialGrid(kind);

      const geometry = buildGroundGeometry(params.world.geometry, config.size);
      // Radial's own Grid is drawn as line geometry instead (see above), so
      // the disc itself just goes invisible rather than wearing a wasted texture.
      const material = isRadialGrid
        ? new THREE.MeshBasicMaterial({ visible: false })
        : buildSurfaceMaterial(config, isSky, persistentTex);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.visible = config.surface !== 'Off' && !isRadialGrid;
      mesh.receiveShadow = !isSky;
      mesh.castShadow = false;
      positionGroundMesh(mesh, config, isSky);

      scene.add(mesh);
      if (isSky) skyMesh = mesh; else floorMesh = mesh;

      if (isRadialGrid) {
        const group = buildRadialGridGroup(config);
        positionRadialGridGroup(group, config, isSky);
        scene.add(group);
        if (isSky) skyRadialGrid = group; else floorRadialGrid = group;
      }
    }

    // Cheap re-layout for when only the construct's height changed (dragging
    // the Cube dimension sliders fires continuously; a full geometry/material
    // rebuild on every tick would be wasteful, repositioning is nearly free).
    function repositionGroundMeshes() {
      if (floorMesh) positionGroundMesh(floorMesh, params.floor, false);
      if (skyMesh) positionGroundMesh(skyMesh, params.sky, true);
      if (floorRadialGrid) positionRadialGridGroup(floorRadialGrid, params.floor, false);
      if (skyRadialGrid) positionRadialGridGroup(skyRadialGrid, params.sky, true);
    }

    function loadGroundImage(kind, file) {
      const reader = new FileReader();
      reader.onload = e => {
        new THREE.TextureLoader().load(e.target.result, texture => {
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          if (kind === 'sky') {
            if (skyImageTexture) skyImageTexture.dispose();
            skyImageTexture = texture;
          } else {
            if (floorImageTexture) floorImageTexture.dispose();
            floorImageTexture = texture;
          }
          rebuildGroundMesh(kind);
        });
      };
      reader.readAsDataURL(file);
    }

    rebuildGroundMesh('floor');
    rebuildGroundMesh('sky');

    // --- Cube Materials Construction ---
    // Standard BoxGeometry material array order: [+X, -X, +Y, -Y, +Z, -Z]
    // In local space: +Z points outwards away from center, -Z points inwards toward center
    function createCubeMaterials() {
      const matInward = new THREE.MeshStandardMaterial({
        color: params.surfaceColors.inwardFace,
        roughness: 0.2,
        metalness: 0.1
      });
      const matOutward = new THREE.MeshBasicMaterial({
        color: params.surfaceColors.outwardFace
      });
      const matParallel = new THREE.MeshBasicMaterial({
        color: params.surfaceColors.parallelFaces
      });

      return [
        matParallel, // +X (side)
        matParallel, // -X (side)
        matParallel, // +Y (top parallel to horizon)
        matParallel, // -Y (bottom parallel to horizon)
        matOutward,  // +Z (facing outward away from source)
        matInward    // -Z (facing inward directly towards central source)
      ];
    }

    let cubeMaterials = createCubeMaterials();

    // --- Orbiting Group & Cubes ---
    const orbitGroup = new THREE.Group();
    scene.add(orbitGroup);

    const cubes = [];
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);

    function buildOrbitingCubes() {
      // Clear existing
      while (orbitGroup.children.length > 0) {
        orbitGroup.remove(orbitGroup.children[0]);
      }
      cubes.length = 0;

      const count = params.orbit.count;
      for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(cubeGeo, cubeMaterials);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const angle = (i / count) * Math.PI * 2;
        mesh.position.set(
          Math.cos(angle) * params.orbit.radius,
          0,
          Math.sin(angle) * params.orbit.radius
        );

        // Orient box so -Z faces the origin (0, 0, 0)
        mesh.lookAt(0, 0, 0);

        // Apply scale
        mesh.scale.set(params.cube.sizeX, params.cube.sizeY, params.cube.sizeZ);

        orbitGroup.add(mesh);
        cubes.push(mesh);
      }
    }

    buildOrbitingCubes();

    // --- Runner Entity ---
    const runnerGroup = new THREE.Group();
    scene.add(runnerGroup);

    const runnerBodyMat = new THREE.MeshStandardMaterial({
      color: params.runner.color,
      roughness: 0.4
    });
    const limbMat = new THREE.MeshStandardMaterial({ color: params.runner.color });

    // The runner's visual can be swapped between a few built-in shapes or a
    // user-supplied STL/OBJ model. `runnerMeshes` always holds every mesh
    // belonging to the *current* shape (for raycasting/selection); `runnerLegs`
    // is only populated for the articulated Rectifier shape (for leg-swing).
    let runnerMeshes = [];
    let runnerLegs = null;
    let lastCustomObject = null; // cache so re-selecting "Custom" doesn't require re-upload

    function clearRunnerVisual() {
      while (runnerGroup.children.length > 0) {
        const child = runnerGroup.children[0];
        runnerGroup.remove(child);
        child.traverse(node => {
          if (node.geometry && node.geometry.dispose) node.geometry.dispose();
        });
      }
      runnerMeshes = [];
      runnerLegs = null;
    }

    function buildRectifierRunner() {
      clearRunnerVisual();
      const torsoGeo = new THREE.BoxGeometry(0.8, 1.2, 0.5);
      const torso = new THREE.Mesh(torsoGeo, runnerBodyMat);
      torso.castShadow = true;
      torso.position.y = 1.2;
      runnerGroup.add(torso);

      const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
      const leftLeg = new THREE.Mesh(legGeo, limbMat);
      leftLeg.position.set(-0.25, 0.4, 0);
      leftLeg.castShadow = true;
      runnerGroup.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, limbMat);
      rightLeg.position.set(0.25, 0.4, 0);
      rightLeg.castShadow = true;
      runnerGroup.add(rightLeg);

      runnerMeshes = [torso, leftLeg, rightLeg];
      runnerLegs = { left: leftLeg, right: rightLeg };
    }

    function buildSphereRunner() {
      clearRunnerVisual();
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 16), runnerBodyMat);
      mesh.castShadow = true;
      mesh.position.y = 0.6;
      runnerGroup.add(mesh);
      runnerMeshes = [mesh];
    }

    function buildCubeRunner() {
      clearRunnerVisual();
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), runnerBodyMat);
      mesh.castShadow = true;
      mesh.position.y = 0.5;
      runnerGroup.add(mesh);
      runnerMeshes = [mesh];
    }

    // Normalizes a loaded STL/OBJ object (any size/origin/units) to sit
    // centered on the ground at a size comparable to the built-in shapes.
    function normalizeCustomObject(object3D) {
      const box = new THREE.Box3().setFromObject(object3D);
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 1.4 / maxDim;
      object3D.scale.setScalar(scale);
      object3D.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
    }

    function attachCustomRunnerObject(object3D) {
      clearRunnerVisual();
      object3D.traverse(node => {
        if (node.isMesh) {
          node.material = runnerBodyMat;
          node.castShadow = true;
          runnerMeshes.push(node);
        }
      });
      runnerGroup.add(object3D);
    }

    function buildCustomRunner(freshObject3D) {
      normalizeCustomObject(freshObject3D);
      lastCustomObject = freshObject3D;
      attachCustomRunnerObject(freshObject3D);
    }

    function buildRunnerShape(shape) {
      if (shape === 'Rectifier') buildRectifierRunner();
      else if (shape === 'Sphere') buildSphereRunner();
      else if (shape === 'Cube') buildCubeRunner();
      else if (shape === 'Custom') {
        if (lastCustomObject) attachCustomRunnerObject(lastCustomObject.clone(true));
        else buildCubeRunner(); // placeholder until a model is uploaded
      }
    }

    function applyRunnerShape(shape) {
      buildRunnerShape(shape);
      clearSelection();
    }

    // Respects a loaded program's shape instead of always starting as
    // Rectifier — buildRunnerShape() (not applyRunnerShape()) because
    // clearSelection() reaches into selection/HUD state that isn't
    // constructed yet this early in the script, and there's nothing
    // selected at startup to clear anyway.
    buildRunnerShape(params.runner.shape);

    // STL / OBJ loading for the "Custom" runner shape
    const stlLoader = new THREE.STLLoader();
    const objLoader = new THREE.OBJLoader();

    function loadCustomRunnerFile(file) {
      const name = file.name.toLowerCase();
      const reader = new FileReader();
      if (name.endsWith('.stl')) {
        reader.onload = e => buildCustomRunner(new THREE.Mesh(stlLoader.parse(e.target.result)));
        reader.readAsArrayBuffer(file);
      } else if (name.endsWith('.obj')) {
        reader.onload = e => buildCustomRunner(objLoader.parse(e.target.result));
        reader.readAsText(file);
      } else {
        alert('Unsupported file type — please choose an .stl or .obj file.');
      }
    }

    runnerGroup.scale.setScalar(params.runner.size);

    // --- Runner Path Playback State ---
    // Path geometry (nodes/mode/cornering) lives in params.runner.path; this
    // is the derived per-frame state animate() advances every tick. The
    // sampler itself, the 3D drag handles, and the visual line are built by
    // the "Runner Path" section further down (after raycasting is set up).
    let pathSampler = null;    // { length, pointAt(distance) } — see syncPath()
    let runnerProgress = 0;    // distance travelled along the current path, in units
    let runnerDirection = 1;   // 1 = start→end, -1 = end→start (Boomerang)
    let runnerForward = { x: 0, y: 0, z: -1 }; // last known travel direction (XZ), for facing + camera trail

    // --- Manual Camera Controls (mouse drag / touch drag, wheel / pinch zoom) ---
    // Registered unconditionally so the gesture handlers are always attached;
    // `controls.enabled` gates whether they actually move the camera, since
    // the auto-tracking modes below drive camera.position/lookAt themselves.
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 4;
    controls.maxDistance = 260;
    controls.target.set(0, 0, 0);
    controls.enabled = params.camera.trackingMode === 'Manual Control'; // respects a loaded program
    controls.update();

    // --- Entity Selection (double-click / double-tap) ---
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let selectionHelper = null;
    let selectedEntity = null;

    const selectionBar = document.getElementById('lcars-selection');
    const selectionValueEl = document.getElementById('lcars-selection-value');
    const selectionClearBtn = document.getElementById('lcars-selection-clear');

    function selectableTargets() {
      return [...cubes, sourceMesh, ...runnerMeshes];
    }

    // Map a raw raycast hit back to the logical entity it belongs to
    function resolveEntity(obj) {
      const cubeIndex = cubes.indexOf(obj);
      if (cubeIndex !== -1) return { root: obj, label: 'Orbit Cube ' + (cubeIndex + 1) };
      if (obj === sourceMesh) return { root: obj, label: 'Central Source' };
      if (runnerMeshes.includes(obj)) return { root: runnerGroup, label: 'Runner' };
      return null;
    }

    function setSelection(entity) {
      clearSelection();
      selectedEntity = entity.root;
      selectionHelper = new THREE.BoxHelper(entity.root, hexToNum(LCARS_PALETTE.alert));
      scene.add(selectionHelper);
      selectionValueEl.textContent = entity.label;
      selectionBar.hidden = false;
      // In Manual Control mode, re-center orbiting on whatever was just selected
      if (controls.enabled) {
        const targetPos = new THREE.Vector3();
        entity.root.getWorldPosition(targetPos);
        controls.target.copy(targetPos);
      }
    }

    function clearSelection() {
      if (selectionHelper) {
        scene.remove(selectionHelper);
        selectionHelper.geometry.dispose();
        selectionHelper.material.dispose();
        selectionHelper = null;
      }
      selectedEntity = null;
      selectionBar.hidden = true;
    }

    function handleActivateAt(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);

      const hits = raycaster.intersectObjects(selectableTargets(), false);
      if (hits.length === 0) {
        if (selectedEntity) playDismiss();
        clearSelection();
        return;
      }
      const entity = resolveEntity(hits[0].object);
      if (!entity) {
        if (selectedEntity) playDismiss();
        clearSelection();
        return;
      }
      // Double-tapping the already-selected entity deselects it
      if (selectedEntity === entity.root) {
        playDismiss();
        clearSelection();
      } else {
        setSelection(entity);
        playConfirm();
      }
    }

    selectionClearBtn.addEventListener('click', () => {
      if (selectedEntity) playDismiss();
      clearSelection();
    });

    // --- Living-system telemetry (purely decorative, aria-hidden) ---
    // A stardate ticker and a few flavor readouts in the spine — they don't
    // mean anything and never take focus or a pointer event; they exist so
    // the HUD reads as a system that's alive, not a static prop. Only runs
    // while the HUD is actually open, so there's nothing to update (or for
    // a screen reader to skip past) while it's summoned away.
    const stardateEl = document.getElementById('lcars-stardate');
    const spineTicks = document.querySelectorAll('.lcars-hud__tick');
    let telemetryTimer = null;

    function computeStardate() {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 0);
      const dayOfYear = Math.floor((now - startOfYear) / 86400000);
      const secondsToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      // Cosmetic offset only, not canon math: a slow-moving "epoch" plus a
      // seconds-based fraction that visibly ticks every second, so the
      // readout actually reads as live at the 1s update cadence below.
      const whole = 47000 + (now.getFullYear() - 2024) * 1000 + Math.floor(dayOfYear * 2.7);
      const frac = (secondsToday % 100).toString().padStart(2, '0');
      return 'SD ' + whole + '.' + frac;
    }

    function randomTick() {
      return Math.floor(Math.random() * 0xfff).toString(16).toUpperCase().padStart(3, '0');
    }

    function startTelemetry() {
      if (telemetryTimer) return;
      if (stardateEl) stardateEl.textContent = computeStardate();
      spineTicks.forEach(t => { t.textContent = randomTick(); });
      telemetryTimer = setInterval(() => {
        if (stardateEl) stardateEl.textContent = computeStardate();
        // Stagger which tick updates so they don't all flicker in lockstep
        const i = Math.floor(Math.random() * spineTicks.length);
        if (spineTicks[i]) spineTicks[i].textContent = randomTick();
      }, 1000);
    }

    function stopTelemetry() {
      clearInterval(telemetryTimer);
      telemetryTimer = null;
    }

    // --- HUD Open/Close (double-tap/double-click to summon or dismiss) ---
    const hudEl = document.getElementById('lcars-hud');
    const hudHintEl = document.getElementById('lcars-hud-hint');
    let menuOpen = false;

    function openMenu() {
      if (menuOpen) return;
      menuOpen = true;
      hudEl.classList.add('is-open');
      hudHintEl.hidden = true;
      updatePathMarkersVisibility();
      startTelemetry();
      playOpen();
      // Move focus into the panel, same as any standard disclosure widget —
      // TABS/activeTabId are defined further down but this only runs later,
      // after a real open gesture, by which point they're long since ready.
      const active = TABS.find(t => t.id === activeTabId);
      if (active) active.btn.focus();
    }

    function closeMenu() {
      if (!menuOpen) return;
      menuOpen = false;
      hudEl.classList.remove('is-open');
      hudHintEl.hidden = false;
      updatePathMarkersVisibility();
      stopTelemetry();
      playDismiss();
      hudHintEl.focus(); // return focus to the (now visible again) summon control
    }

    // The hint doubles as the only way to reach the HUD without a
    // double-tap/double-click gesture — a single click/tap/Enter opens it.
    hudHintEl.addEventListener('click', openMenu);
    // Escape is the standard, expected way to dismiss an open overlay panel.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menuOpen) closeMenu();
    });

    // Unified double-click (mouse) / double-tap (touch) detection via Pointer
    // Events, so both input types share one code path instead of relying on
    // the (touch-unreliable) native 'dblclick' event. Shared by the scene
    // canvas (open the menu / select an entity) and the HUD itself (close it).
    const DOUBLE_TAP_MS = 350;
    const DOUBLE_TAP_PX = 28;

    function watchDoubleActivate(el, onDoubleActivate) {
      let last = { time: 0, x: 0, y: 0, pointerType: '' };
      el.addEventListener('pointerup', (e) => {
        const now = performance.now();
        const dx = e.clientX - last.x;
        const dy = e.clientY - last.y;
        const isDouble =
          (now - last.time) < DOUBLE_TAP_MS &&
          Math.hypot(dx, dy) < DOUBLE_TAP_PX &&
          e.pointerType === last.pointerType;

        if (isDouble) {
          onDoubleActivate(e);
          last.time = 0; // consume, so a triple tap doesn't re-trigger
        } else {
          last = { time: now, x: e.clientX, y: e.clientY, pointerType: e.pointerType };
        }
      });
    }

    watchDoubleActivate(renderer.domElement, (e) => {
      // First double-tap in the scene just summons the menu; once it's open,
      // double-tap goes back to selecting/deselecting whatever is under it.
      if (!menuOpen) {
        openMenu();
        return;
      }
      handleActivateAt(e.clientX, e.clientY);
    });

    watchDoubleActivate(hudEl, () => {
      if (menuOpen) closeMenu();
    });

    // --- Runner Path: node math, 3D visualization, drag-to-edit handles ---
    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

    // Distance-based sampler over the path nodes: pointAt(distance) walks the
    // path at constant speed no matter how many nodes or which corner style.
    function buildPathSampler(nodes, cornerStyle) {
      if (cornerStyle === 'Round' && nodes.length >= 3) {
        const points = nodes.map(n => new THREE.Vector3(n.x, n.y, n.z));
        const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
        const length = curve.getLength();
        return {
          length,
          pointAt(distance) {
            const t = length > 0 ? clamp(distance / length, 0, 1) : 0;
            return curve.getPointAt(t);
          }
        };
      }
      // Square corners (or only 2 nodes, where round and square are identical): straight segments
      const segLengths = [];
      let total = 0;
      for (let i = 0; i < nodes.length - 1; i++) {
        const a = nodes[i], b = nodes[i + 1];
        const d = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
        segLengths.push(d);
        total += d;
      }
      return {
        length: total,
        pointAt(distance) {
          let remaining = clamp(distance, 0, total);
          for (let i = 0; i < segLengths.length; i++) {
            const segLen = segLengths[i];
            if (remaining <= segLen || i === segLengths.length - 1) {
              const t = segLen > 0 ? remaining / segLen : 0;
              const a = nodes[i], b = nodes[i + 1];
              return new THREE.Vector3(
                a.x + (b.x - a.x) * t,
                a.y + (b.y - a.y) * t,
                a.z + (b.z - a.z) * t
              );
            }
            remaining -= segLen;
          }
          const last = nodes[nodes.length - 1];
          return new THREE.Vector3(last.x, last.y, last.z);
        }
      };
    }

    // Regenerates the node list to a new count, keeping start/end fixed and
    // redistributing intermediate nodes evenly along the start→end line.
    function setPathNodeCount(count) {
      const nodes = params.runner.path.nodes;
      const start = nodes[0];
      const end = nodes[nodes.length - 1];
      const next = [];
      for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0 : i / (count - 1);
        next.push({
          x: start.x + (end.x - start.x) * t,
          y: start.y + (end.y - start.y) * t,
          z: start.z + (end.z - start.z) * t
        });
      }
      params.runner.path.nodes = next;
    }

    let pathMarkers = [];
    let pathLine = null;
    let pathMarkersVisible = false;

    // Rebuilds the sampler and visual line (always), and the drag handles
    // (only when the node count changed) from params.runner.path.
    function syncPath(options) {
      const nodes = params.runner.path.nodes;
      const rebuildMarkers = (options && options.rebuildMarkers) || pathMarkers.length !== nodes.length;

      if (rebuildMarkers) {
        pathMarkers.forEach(m => {
          scene.remove(m);
          m.geometry.dispose();
          m.material.dispose();
        });
        pathMarkers = nodes.map((n, i) => {
          const isEndpoint = i === 0 || i === nodes.length - 1;
          const marker = new THREE.Mesh(
            new THREE.SphereGeometry(isEndpoint ? 0.9 : 0.55, 16, 12),
            new THREE.MeshBasicMaterial({ color: isEndpoint ? hexToNum(LCARS_PALETTE.mars) : hexToNum(LCARS_PALETTE.gold), depthTest: false })
          );
          marker.renderOrder = 999;
          marker.userData.nodeIndex = i;
          marker.visible = pathMarkersVisible;
          scene.add(marker);
          return marker;
        });
      }
      pathMarkers.forEach((m, i) => m.position.set(nodes[i].x, nodes[i].y, nodes[i].z));

      pathSampler = buildPathSampler(nodes, params.runner.path.corner);
      const segments = 48;
      const linePts = [];
      for (let i = 0; i <= segments; i++) linePts.push(pathSampler.pointAt((i / segments) * pathSampler.length));
      if (!pathLine) {
        pathLine = new THREE.Line(
          new THREE.BufferGeometry(),
          new THREE.LineBasicMaterial({ color: hexToNum(LCARS_PALETTE.alert), transparent: true, opacity: 0.6, depthTest: false })
        );
        pathLine.renderOrder = 998;
        pathLine.visible = pathMarkersVisible;
        scene.add(pathLine);
      }
      pathLine.geometry.dispose();
      pathLine.geometry = new THREE.BufferGeometry().setFromPoints(linePts);

      runnerProgress = clamp(runnerProgress, 0, pathSampler.length);
    }

    syncPath({ rebuildMarkers: true });

    function setPathMarkersVisible(visible) {
      pathMarkersVisible = visible;
      pathMarkers.forEach(m => { m.visible = visible; });
      if (pathLine) pathLine.visible = visible;
    }

    // The path is only shown/draggable while it's actually being edited, so
    // the scene stays clean the rest of the time.
    function updatePathMarkersVisibility() {
      setPathMarkersVisible(menuOpen && activeTabId === 'runner');
    }

    // Drag-to-edit path nodes (mouse + touch), constrained to the node's own
    // horizontal plane. Only active when the handles are visible and the
    // camera isn't in Manual Control, so a drag never fights an orbit gesture.
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const dragPoint = new THREE.Vector3();
    let draggingNodeIndex = null;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (controls.enabled || !pathMarkersVisible) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(pathMarkers, false);
      if (hits.length === 0) return;

      draggingNodeIndex = hits[0].object.userData.nodeIndex;
      dragPlane.constant = -hits[0].object.position.y; // drag along the node's own height
      e.preventDefault();
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (draggingNodeIndex === null) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      if (!raycaster.ray.intersectPlane(dragPlane, dragPoint)) return;

      const node = params.runner.path.nodes[draggingNodeIndex];
      node.x = clamp(dragPoint.x, -100, 100);
      node.z = clamp(dragPoint.z, -100, 100);
      syncPath();

      const lastIndex = params.runner.path.nodes.length - 1;
      if (draggingNodeIndex === 0) {
        pathStartXPanel.refresh(node.x);
        pathStartZPanel.refresh(node.z);
      } else if (draggingNodeIndex === lastIndex) {
        pathEndXPanel.refresh(node.x);
        pathEndZPanel.refresh(node.z);
      }
    });

    window.addEventListener('pointerup', () => { draggingNodeIndex = null; });

    // --- Interaction Audio (synthesized, muted by default) ---
    // Never plays on page load — only ever invoked from inside a click/key
    // event handler, which is exactly what the browser autoplay policy
    // requires anyway. No audio files: a handful of short Web Audio
    // oscillator blips instead, kept deliberately quiet and few in number.
    let audioCtx = null;
    let audioEnabled = false;

    function ensureAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playBlip(freqStart, freqEnd, duration, volume) {
      if (!audioEnabled) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), ctx.currentTime + duration);
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }

    function playTick() { playBlip(880, 1100, 0.06, 0.05); }    // any button/tab/toggle press
    function playConfirm() { playBlip(660, 990, 0.09, 0.06); }  // entity selected
    function playDismiss() { playBlip(990, 660, 0.09, 0.06); }  // entity deselected / HUD closed
    function playOpen() { playBlip(520, 1040, 0.12, 0.06); }    // HUD opened

    const audioToggleBtn = document.getElementById('lcars-audio-toggle');
    audioToggleBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      audioToggleBtn.setAttribute('aria-pressed', audioEnabled ? 'true' : 'false');
      if (audioEnabled) {
        ensureAudioContext();
        playTick(); // immediate confirmation that sound just turned on
      }
    });

    // --- Dynamic Updates Helper Functions ---
    function updateMaterials() {
      cubeMaterials[0].color.set(params.surfaceColors.parallelFaces);
      cubeMaterials[1].color.set(params.surfaceColors.parallelFaces);
      cubeMaterials[2].color.set(params.surfaceColors.parallelFaces);
      cubeMaterials[3].color.set(params.surfaceColors.parallelFaces);
      cubeMaterials[4].color.set(params.surfaceColors.outwardFace);
      cubeMaterials[5].color.set(params.surfaceColors.inwardFace);
    }

    function updateCubeScale() {
      cubes.forEach(cube => {
        cube.scale.set(params.cube.sizeX, params.cube.sizeY, params.cube.sizeZ);
      });
      repositionGroundMeshes();
    }

    // --- LCARS HUD: element builders ---
    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    // Every panel's visible title doubles as its control's accessible name
    // via aria-labelledby, instead of a separately-typed aria-label string
    // that could drift out of sync with what's on screen. panelIdCounter
    // guarantees a unique id per panel across the whole HUD.
    let panelIdCounter = 0;

    function panelHeader(code, title) {
      const titleId = 'lcars-label-' + (panelIdCounter++);
      const header = el('div', 'lcars-panel__header');
      const titleSpan = el('span', null, title);
      titleSpan.id = titleId;
      header.appendChild(titleSpan);
      header.appendChild(el('span', 'lcars-panel__code', code));
      return { headerEl: header, titleId };
    }

    function createSliderPanel(container, opts) {
      const format = opts.format || (v => v);
      const valueText = v => String(format(v)) + (opts.unit ? ' ' + opts.unit : '');
      const panel = el('div', 'lcars-panel' + (opts.sub ? ' lcars-panel--sub' : ''));
      if (opts.visible === false) panel.style.display = 'none';
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const valueEl = el('div', 'tool-value', format(opts.value));
      if (opts.unit) valueEl.appendChild(el('span', 'tool-value__unit', opts.unit));
      panel.appendChild(valueEl);

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'tool-slider';
      slider.min = opts.min;
      slider.max = opts.max;
      slider.step = opts.step;
      slider.value = opts.value;
      slider.setAttribute('aria-labelledby', titleId);
      // Screen readers announce the raw slider number by default; this makes
      // them announce the same formatted+unit text the panel displays instead.
      slider.setAttribute('aria-valuetext', valueText(opts.value));
      slider.addEventListener('input', () => {
        const v = parseFloat(slider.value);
        valueEl.childNodes[0].textContent = format(v);
        slider.setAttribute('aria-valuetext', valueText(v));
        opts.onInput(v);
      });
      panel.appendChild(slider);

      container.appendChild(panel);
      return {
        refresh(v) {
          slider.value = v;
          valueEl.childNodes[0].textContent = format(v);
          slider.setAttribute('aria-valuetext', valueText(v));
        },
        setVisible(v) { panel.style.display = v ? '' : 'none'; }
      };
    }

    function createTogglePanel(container, opts) {
      const onLabel = opts.onLabel || 'ENABLED';
      const offLabel = opts.offLabel || 'DISABLED';
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const row = el('div', 'tool-toggle-row');
      const valueEl = el('div', 'tool-value tool-value--text', opts.value ? onLabel : offLabel);
      const toggle = document.createElement('input');
      toggle.type = 'checkbox';
      toggle.className = 'tool-toggle';
      toggle.checked = opts.value;
      toggle.setAttribute('aria-labelledby', titleId);
      toggle.addEventListener('change', () => {
        playTick();
        valueEl.textContent = toggle.checked ? onLabel : offLabel;
        opts.onChange(toggle.checked);
      });
      row.appendChild(valueEl);
      row.appendChild(toggle);
      panel.appendChild(row);

      container.appendChild(panel);
      return {
        refresh(v) {
          toggle.checked = v;
          valueEl.textContent = v ? onLabel : offLabel;
        }
      };
    }

    function createSelectPanel(container, opts) {
      const labels = opts.labels || {};
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const valueEl = el('div', 'tool-value tool-value--text', opts.value);
      panel.appendChild(valueEl);

      const optsRow = el('div', 'tool-select');
      optsRow.setAttribute('role', 'group');
      optsRow.setAttribute('aria-labelledby', titleId);
      const buttons = opts.options.map(optVal => {
        const btn = el('button', 'tool-select__opt' + (optVal === opts.value ? ' is-active' : ''), labels[optVal] || optVal);
        btn.type = 'button';
        btn.dataset.value = optVal;
        btn.setAttribute('aria-pressed', optVal === opts.value ? 'true' : 'false');
        btn.addEventListener('click', () => {
          playTick();
          buttons.forEach(b => {
            b.classList.remove('is-active');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('is-active');
          btn.setAttribute('aria-pressed', 'true');
          valueEl.textContent = optVal;
          opts.onChange(optVal);
        });
        optsRow.appendChild(btn);
        return btn;
      });
      panel.appendChild(optsRow);

      container.appendChild(panel);
      return {
        refresh(v) {
          valueEl.textContent = v;
          buttons.forEach(b => {
            const active = b.dataset.value === v;
            b.classList.toggle('is-active', active);
            b.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
        },
        setVisible(v) { panel.style.display = v ? '' : 'none'; }
      };
    }

    function createColorPanel(container, opts) {
      const panel = el('div', 'lcars-panel');
      if (opts.visible === false) panel.style.display = 'none';
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const row = el('div', 'tool-color-row');
      const valueEl = el('div', 'tool-value tool-value--text', opts.value.toUpperCase());
      const swatch = document.createElement('input');
      swatch.type = 'color';
      swatch.className = 'tool-color-swatch';
      swatch.value = opts.value;
      swatch.setAttribute('aria-labelledby', titleId);
      swatch.addEventListener('input', () => {
        valueEl.textContent = swatch.value.toUpperCase();
        opts.onChange(swatch.value);
      });
      row.appendChild(swatch);
      row.appendChild(valueEl);
      panel.appendChild(row);

      container.appendChild(panel);
      return {
        refresh(v) {
          swatch.value = v;
          valueEl.textContent = v.toUpperCase();
        },
        setVisible(v) { panel.style.display = v ? '' : 'none'; }
      };
    }

    function createFilePanel(container, opts) {
      const panel = el('div', 'lcars-panel');
      panel.style.display = opts.visible ? '' : 'none';
      const { headerEl, titleId } = panelHeader(opts.code, opts.title);
      panel.appendChild(headerEl);

      const valueEl = el('div', 'tool-value tool-value--text', opts.value || 'NO FILE LOADED');
      panel.appendChild(valueEl);

      const input = document.createElement('input');
      input.type = 'file';
      input.className = 'tool-file';
      if (opts.accept) input.accept = opts.accept;
      input.setAttribute('aria-labelledby', titleId);
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (file) {
          playTick();
          valueEl.textContent = file.name.toUpperCase();
          opts.onChange(file);
        }
      });
      panel.appendChild(input);

      container.appendChild(panel);
      return {
        setVisible(v) { panel.style.display = v ? '' : 'none'; },
        refresh(v) { valueEl.textContent = v; }
      };
    }

    // --- LCARS HUD: menu + tabs scaffold ---
    const hudMenu = document.getElementById('lcars-menu');
    const hudPanels = document.getElementById('lcars-tabpanels');
    hudMenu.setAttribute('role', 'tablist');
    hudMenu.setAttribute('aria-label', 'Control categories');

    const TABS = [
      { id: 'source', label: 'Source', accent: LCARS_PALETTE.butterscotch },
      { id: 'orbit', label: 'Orbit', accent: LCARS_PALETTE.africanViolet },
      { id: 'cube', label: 'Cube', accent: LCARS_PALETTE.periwinkle },
      { id: 'surface', label: 'Surface', accent: LCARS_PALETTE.gold },
      { id: 'runner', label: 'Runner', accent: LCARS_PALETTE.mars },
      { id: 'camera', label: 'Camera', accent: LCARS_PALETTE.ice },
      { id: 'world', label: 'World', accent: LCARS_PALETTE.salmon },
      { id: 'memory', label: 'Memory', accent: LCARS_PALETTE.plum }
    ];

    const tabPanelEls = {};
    TABS.forEach((tab, i) => {
      const btn = el('button', 'lcars-tab' + (i === 0 ? ' is-active' : ''), tab.label);
      btn.type = 'button';
      btn.id = 'lcars-tab-' + tab.id;
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      btn.setAttribute('aria-controls', 'lcars-tabpanel-' + tab.id);
      btn.tabIndex = i === 0 ? 0 : -1; // roving tabindex — standard ARIA tablist pattern
      btn.style.setProperty('--tab-accent', tab.accent);
      btn.style.setProperty('--tab-accent-dim', dimHex(tab.accent, 0.85));
      btn.addEventListener('click', () => activateTab(tab.id));
      hudMenu.appendChild(btn);
      tab.btn = btn;

      const panelEl = el('div', 'lcars-tabpanel' + (i === 0 ? ' is-active' : ''));
      panelEl.id = 'lcars-tabpanel-' + tab.id;
      panelEl.setAttribute('role', 'tabpanel');
      panelEl.setAttribute('aria-labelledby', btn.id);
      panelEl.style.setProperty('--accent', tab.accent);
      hudPanels.appendChild(panelEl);
      tabPanelEls[tab.id] = panelEl;
    });

    let activeTabId = TABS[0].id;

    function activateTab(id) {
      activeTabId = id;
      const activeTab = TABS.find(t => t.id === id);
      if (activeTab) hudEl.style.setProperty('--spine-accent', activeTab.accent); // live "you are here" cue
      TABS.forEach(tab => {
        const active = tab.id === id;
        tab.btn.classList.toggle('is-active', active);
        tab.btn.setAttribute('aria-selected', active ? 'true' : 'false');
        tab.btn.tabIndex = active ? 0 : -1;
        tabPanelEls[tab.id].classList.toggle('is-active', active);
      });
      updatePathMarkersVisibility();
      playTick(); // no-ops silently at the initial bootstrap call — audio starts off
    }

    // Left/Right/Home/End moves focus AND activates — the standard ARIA
    // "manual activation" tablist keyboard pattern.
    hudMenu.addEventListener('keydown', (e) => {
      const currentIndex = TABS.findIndex(t => t.id === activeTabId);
      let nextIndex = null;
      if (e.key === 'ArrowRight') nextIndex = (currentIndex + 1) % TABS.length;
      else if (e.key === 'ArrowLeft') nextIndex = (currentIndex - 1 + TABS.length) % TABS.length;
      else if (e.key === 'Home') nextIndex = 0;
      else if (e.key === 'End') nextIndex = TABS.length - 1;
      if (nextIndex === null) return;
      e.preventDefault();
      activateTab(TABS[nextIndex].id);
      TABS[nextIndex].btn.focus();
    });

    activateTab(TABS[0].id); // seed the spine color to match the default active tab

    const sourceTab = tabPanelEls.source;

    createSliderPanel(sourceTab, { code: 'SRC-04', title: 'Light Range', unit: 'u', min: 10, max: 300, step: 1, value: params.source.distance, format: v => Math.round(v), onInput: v => {

    // 2. Orbit & Central Cog — the structural mechanism orbiting the source
    createSliderPanel(orbitTab, { code: 'ORB-01', title: 'Cube Count', unit: 'n', min: 3, max: 24, step: 1, value: params.orbit.count, format: v => Math.round(v), onInput: v => {

    // 4. Surface Colors — material finish applied on top of the geometry
    createSelectPanel(surfaceTab, {

    // 7. World — the reference frame first (Alignment), then the two

          gridSizePanel.setVisible(v === 'Grid');

    buildGroundPanels(worldTab, 'floor', 'FLR', 'Floor');
