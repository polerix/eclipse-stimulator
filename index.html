<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>8-Cube Occlusion Construct</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: monospace;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      /* Hand every touch gesture (drag-orbit, pinch-zoom) to OrbitControls
         instead of letting the browser scroll/zoom the page with it. */
      touch-action: none;
    }
    /* --- LCARS HUD --- */
    /* Closed by default: summoned with a double-tap/double-click anywhere in
       the scene, dismissed with a double-tap/double-click anywhere on it. */
    .lcars-hud {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 320px;
      max-height: calc(100vh - 40px);
      display: none;
      flex-direction: column;
      background: rgba(8, 8, 10, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      backdrop-filter: blur(6px);
      color: #e8e8e8;
      font-family: monospace;
      z-index: 20;
      overflow: hidden;
      /* Menu stays finger-friendly: taps register instantly and double-tap
         never triggers the browser's page-zoom gesture. */
      touch-action: manipulation;
    }

    .lcars-hud.is-open { display: flex; }

    .lcars-hud-hint {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 14px;
      font-family: monospace;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255, 156, 0, 0.75);
      background: rgba(8, 8, 10, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      z-index: 20;
      /* Purely informational — never steal the double-tap meant for the canvas underneath */
      pointer-events: none;
    }

    .lcars-hud-hint[hidden] { display: none; }

    .lcars-hud__selection {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(51, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .lcars-hud__selection[hidden] { display: none; }

    .lcars-hud__selection-label {
      color: #33ffff;
      font-weight: bold;
    }

    .lcars-hud__selection-value {
      flex: 1;
      overflow: hidden;
      color: #fff;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .lcars-hud__selection-clear {
      width: 22px;
      height: 22px;
      font-family: inherit;
      font-size: 11px;
      line-height: 1;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .lcars-hud__selection-clear:hover { background: rgba(255, 255, 255, 0.25); }

    .lcars-hud__title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 16px 10px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ff9c00;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .lcars-hud__subtitle {
      font-size: 10px;
      letter-spacing: 1px;
      opacity: 0.5;
    }

    .lcars-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 10px 10px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .lcars-tab {
      flex: 1 1 auto;
      min-width: 72px;
      text-align: center;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #999;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .lcars-tab:hover { background: rgba(255, 255, 255, 0.12); color: #ddd; }

    .lcars-tab.is-active {
      background: var(--tab-accent, #ff9c00);
      color: #000;
      font-weight: bold;
    }

    .lcars-tabpanels {
      padding: 12px;
      overflow-y: auto;
    }

    .lcars-tabpanel {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .lcars-tabpanel.is-active { display: flex; }

    .lcars-panel {
      background: #131313;
      border-left: 5px solid var(--accent, #ff9c00);
      border-radius: 4px 12px 12px 4px;
      padding: 8px 12px 10px;
    }

    .lcars-panel--sub { margin-left: 14px; }

    .lcars-panel__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--accent, #ff9c00);
      font-weight: bold;
    }

    .lcars-panel__code {
      font-size: 9px;
      font-weight: normal;
      letter-spacing: 0.5px;
      opacity: 0.55;
    }

    .tool-value {
      margin: 4px 0 6px;
      font-size: 20px;
      line-height: 1;
      color: #fff;
    }

    .tool-value--text {
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .tool-value__unit {
      margin-left: 4px;
      font-size: 11px;
      opacity: 0.55;
    }

    .tool-slider {
      width: 100%;
      height: 4px;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .tool-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, #ff9c00);
      border: 2px solid #000;
      cursor: pointer;
    }

    .tool-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent, #ff9c00);
      border: 2px solid #000;
      cursor: pointer;
    }

    .tool-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tool-toggle {
      position: relative;
      width: 40px;
      height: 20px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      transition: background 0.15s;
    }

    .tool-toggle:checked { background: var(--accent, #ff9c00); }

    .tool-toggle::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #000;
      transition: transform 0.15s;
    }

    .tool-toggle:checked::before { transform: translateX(20px); }

    .tool-select {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tool-select__opt {
      flex: 1 1 auto;
      padding: 5px 8px;
      font-family: inherit;
      font-size: 10px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .tool-select__opt.is-active {
      background: var(--accent, #ff9c00);
      color: #000;
      font-weight: bold;
    }

    .tool-color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .tool-color-swatch {
      width: 34px;
      height: 26px;
      padding: 0;
      background: none;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
    }

    .tool-file {
      width: 100%;
      margin-top: 6px;
      font-family: inherit;
      font-size: 10px;
      color: #aaa;
    }

    .tool-file::file-selector-button {
      padding: 5px 10px;
      margin-right: 8px;
      font-family: inherit;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #000;
      background: var(--accent, #ff9c00);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="lcars-hud-hint" id="lcars-hud-hint">HUD-01 · double-tap to open</div>

  <div class="lcars-hud" id="lcars-hud">
    <div class="lcars-hud__title">
      Construct Controls
      <span class="lcars-hud__subtitle">HUD-01</span>
    </div>
    <div class="lcars-hud__selection" id="lcars-selection" hidden>
      <span class="lcars-hud__selection-label">SEL</span>
      <span class="lcars-hud__selection-value" id="lcars-selection-value">—</span>
      <button class="lcars-hud__selection-clear" id="lcars-selection-clear" type="button" aria-label="Clear selection">✕</button>
    </div>
    <nav class="lcars-menu" id="lcars-menu"></nav>
    <div class="lcars-tabpanels" id="lcars-tabpanels"></div>
  </div>

  <script>
    // --- Application State & Parameters ---
    const params = {
      // Surface Colors (Strict 3-tone or custom)
      surfaceColors: {
        preset: 'Default (Black/Grey/White)',
        inwardFace: '#ffffff',   // facing center
        outwardFace: '#000000',  // facing away
        parallelFaces: '#808080' // parallel to horizon & sides
      },
      // Orbit & Central Cog
      orbit: {
        radius: 35,
        speed: 0.25,
        count: 8,
        cogSize: 1.0
      },
      // Orbiting Cubes Dimension
      cube: {
        sizeX: 6,
        sizeY: 6,
        sizeZ: 6,
        proportionalLock: true,
        uniformScale: 6
      },
      // Central Light Source
      source: {
        color: '#ffffff',
        intensity: 2.0,
        size: 1.5,
        distance: 120,
        decay: 1.0
      },
      // Runner
      runner: {
        shape: 'Rectifier',
        size: 0.8,
        path: { x: 0, y: 0, z: 0 }, // world-space center the run path is built around
        pathLength: 60,
        speed: 12.0,
        color: '#000000',
        active: true
      },
      // Camera Controls
      camera: {
        fov: 50,
        trackingMode: 'Runner Tracking',
        distance: 12,
        height: 3.5
      }
    };

    // --- Scene, Renderer & Global References ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    const camera = new THREE.PerspectiveCamera(
      params.camera.fov,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- Central Light & Mesh ---
    const centralPointLight = new THREE.PointLight(
      params.source.color,
      params.source.intensity,
      params.source.distance,
      params.source.decay
    );
    centralPointLight.castShadow = true;
    centralPointLight.shadow.mapSize.width = 2048;
    centralPointLight.shadow.mapSize.height = 2048;
    centralPointLight.shadow.bias = -0.001;
    scene.add(centralPointLight);

    const sourceMeshGeo = new THREE.SphereGeometry(params.source.size, 32, 16);
    const sourceMeshMat = new THREE.MeshBasicMaterial({ color: params.source.color });
    const sourceMesh = new THREE.Mesh(sourceMeshGeo, sourceMeshMat);
    scene.add(sourceMesh);

    // Ambient fill to keep absolute non-lit areas legible if desired
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.05);
    scene.add(ambientLight);

    // Ground plane (horizon aligner & shadow catcher)
    const floorGeo = new THREE.PlaneGeometry(300, 300);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -params.cube.sizeY / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // --- Cube Materials Construction ---
    // Standard BoxGeometry material array order: [+X, -X, +Y, -Y, +Z, -Z]
    // In local space: +Z points outwards away from center, -Z points inwards toward center
    function createCubeMaterials() {
      const matInward = new THREE.MeshStandardMaterial({
        color: params.surfaceColors.inwardFace,
        roughness: 0.2,
        metalness: 0.1
      });
      const matOutward = new THREE.MeshBasicMaterial({
        color: params.surfaceColors.outwardFace
      });
      const matParallel = new THREE.MeshBasicMaterial({
        color: params.surfaceColors.parallelFaces
      });

      return [
        matParallel, // +X (side)
        matParallel, // -X (side)
        matParallel, // +Y (top parallel to horizon)
        matParallel, // -Y (bottom parallel to horizon)
        matOutward,  // +Z (facing outward away from source)
        matInward    // -Z (facing inward directly towards central source)
      ];
    }

    let cubeMaterials = createCubeMaterials();

    // --- Orbiting Group & Cubes ---
    const orbitGroup = new THREE.Group();
    scene.add(orbitGroup);

    const cubes = [];
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);

    function buildOrbitingCubes() {
      // Clear existing
      while (orbitGroup.children.length > 0) {
        orbitGroup.remove(orbitGroup.children[0]);
      }
      cubes.length = 0;

      const count = params.orbit.count;
      for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(cubeGeo, cubeMaterials);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const angle = (i / count) * Math.PI * 2;
        mesh.position.set(
          Math.cos(angle) * params.orbit.radius,
          0,
          Math.sin(angle) * params.orbit.radius
        );

        // Orient box so -Z faces the origin (0, 0, 0)
        mesh.lookAt(0, 0, 0);

        // Apply scale
        mesh.scale.set(params.cube.sizeX, params.cube.sizeY, params.cube.sizeZ);

        orbitGroup.add(mesh);
        cubes.push(mesh);
      }
    }

    buildOrbitingCubes();

    // --- Runner Entity ---
    const runnerGroup = new THREE.Group();
    scene.add(runnerGroup);

    const runnerBodyMat = new THREE.MeshStandardMaterial({
      color: params.runner.color,
      roughness: 0.4
    });
    const limbMat = new THREE.MeshStandardMaterial({ color: params.runner.color });

    // The runner's visual can be swapped between a few built-in shapes or a
    // user-supplied STL/OBJ model. `runnerMeshes` always holds every mesh
    // belonging to the *current* shape (for raycasting/selection); `runnerLegs`
    // is only populated for the articulated Rectifier shape (for leg-swing).
    let runnerMeshes = [];
    let runnerLegs = null;
    let lastCustomObject = null; // cache so re-selecting "Custom" doesn't require re-upload

    function clearRunnerVisual() {
      while (runnerGroup.children.length > 0) {
        const child = runnerGroup.children[0];
        runnerGroup.remove(child);
        child.traverse(node => {
          if (node.geometry && node.geometry.dispose) node.geometry.dispose();
        });
      }
      runnerMeshes = [];
      runnerLegs = null;
    }

    function buildRectifierRunner() {
      clearRunnerVisual();
      const torsoGeo = new THREE.BoxGeometry(0.8, 1.2, 0.5);
      const torso = new THREE.Mesh(torsoGeo, runnerBodyMat);
      torso.castShadow = true;
      torso.position.y = 1.2;
      runnerGroup.add(torso);

      const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
      const leftLeg = new THREE.Mesh(legGeo, limbMat);
      leftLeg.position.set(-0.25, 0.4, 0);
      leftLeg.castShadow = true;
      runnerGroup.add(leftLeg);

      const rightLeg = new THREE.Mesh(legGeo, limbMat);
      rightLeg.position.set(0.25, 0.4, 0);
      rightLeg.castShadow = true;
      runnerGroup.add(rightLeg);

      runnerMeshes = [torso, leftLeg, rightLeg];
      runnerLegs = { left: leftLeg, right: rightLeg };
    }

    function buildSphereRunner() {
      clearRunnerVisual();
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 16), runnerBodyMat);
      mesh.castShadow = true;
      mesh.position.y = 0.6;
      runnerGroup.add(mesh);
      runnerMeshes = [mesh];
    }

    function buildCubeRunner() {
      clearRunnerVisual();
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), runnerBodyMat);
      mesh.castShadow = true;
      mesh.position.y = 0.5;
      runnerGroup.add(mesh);
      runnerMeshes = [mesh];
    }

    // Normalizes a loaded STL/OBJ object (any size/origin/units) to sit
    // centered on the ground at a size comparable to the built-in shapes.
    function normalizeCustomObject(object3D) {
      const box = new THREE.Box3().setFromObject(object3D);
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 1.4 / maxDim;
      object3D.scale.setScalar(scale);
      object3D.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
    }

    function attachCustomRunnerObject(object3D) {
      clearRunnerVisual();
      object3D.traverse(node => {
        if (node.isMesh) {
          node.material = runnerBodyMat;
          node.castShadow = true;
          runnerMeshes.push(node);
        }
      });
      runnerGroup.add(object3D);
    }

    function buildCustomRunner(freshObject3D) {
      normalizeCustomObject(freshObject3D);
      lastCustomObject = freshObject3D;
      attachCustomRunnerObject(freshObject3D);
    }

    function applyRunnerShape(shape) {
      if (shape === 'Rectifier') buildRectifierRunner();
      else if (shape === 'Sphere') buildSphereRunner();
      else if (shape === 'Cube') buildCubeRunner();
      else if (shape === 'Custom') {
        if (lastCustomObject) attachCustomRunnerObject(lastCustomObject.clone(true));
        else buildCubeRunner(); // placeholder until a model is uploaded
      }
      clearSelection();
    }

    buildRectifierRunner();

    // STL / OBJ loading for the "Custom" runner shape
    const stlLoader = new THREE.STLLoader();
    const objLoader = new THREE.OBJLoader();

    function loadCustomRunnerFile(file) {
      const name = file.name.toLowerCase();
      const reader = new FileReader();
      if (name.endsWith('.stl')) {
        reader.onload = e => buildCustomRunner(new THREE.Mesh(stlLoader.parse(e.target.result)));
        reader.readAsArrayBuffer(file);
      } else if (name.endsWith('.obj')) {
        reader.onload = e => buildCustomRunner(objLoader.parse(e.target.result));
        reader.readAsText(file);
      } else {
        alert('Unsupported file type — please choose an .stl or .obj file.');
      }
    }

    // Initial scale & position
    runnerGroup.scale.setScalar(params.runner.size);
    let runnerDistance = params.runner.pathLength;

    // --- Manual Camera Controls (mouse drag / touch drag, wheel / pinch zoom) ---
    // Registered unconditionally so the gesture handlers are always attached;
    // `controls.enabled` gates whether they actually move the camera, since
    // the auto-tracking modes below drive camera.position/lookAt themselves.
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 4;
    controls.maxDistance = 260;
    controls.target.set(0, 0, 0);
    controls.enabled = false;
    controls.update();

    // --- Entity Selection (double-click / double-tap) ---
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let selectionHelper = null;
    let selectedEntity = null;

    const selectionBar = document.getElementById('lcars-selection');
    const selectionValueEl = document.getElementById('lcars-selection-value');
    const selectionClearBtn = document.getElementById('lcars-selection-clear');

    function selectableTargets() {
      return [...cubes, sourceMesh, ...runnerMeshes];
    }

    // Map a raw raycast hit back to the logical entity it belongs to
    function resolveEntity(obj) {
      const cubeIndex = cubes.indexOf(obj);
      if (cubeIndex !== -1) return { root: obj, label: 'Orbit Cube ' + (cubeIndex + 1) };
      if (obj === sourceMesh) return { root: obj, label: 'Central Source' };
      if (runnerMeshes.includes(obj)) return { root: runnerGroup, label: 'Runner' };
      return null;
    }

    function setSelection(entity) {
      clearSelection();
      selectedEntity = entity.root;
      selectionHelper = new THREE.BoxHelper(entity.root, 0x33ffff);
      scene.add(selectionHelper);
      selectionValueEl.textContent = entity.label;
      selectionBar.hidden = false;
      // In Manual Control mode, re-center orbiting on whatever was just selected
      if (controls.enabled) {
        const targetPos = new THREE.Vector3();
        entity.root.getWorldPosition(targetPos);
        controls.target.copy(targetPos);
      }
    }

    function clearSelection() {
      if (selectionHelper) {
        scene.remove(selectionHelper);
        selectionHelper.geometry.dispose();
        selectionHelper.material.dispose();
        selectionHelper = null;
      }
      selectedEntity = null;
      selectionBar.hidden = true;
    }

    function handleActivateAt(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);

      const hits = raycaster.intersectObjects(selectableTargets(), false);
      if (hits.length === 0) {
        clearSelection();
        return;
      }
      const entity = resolveEntity(hits[0].object);
      if (!entity) {
        clearSelection();
        return;
      }
      // Double-tapping the already-selected entity deselects it
      if (selectedEntity === entity.root) {
        clearSelection();
      } else {
        setSelection(entity);
      }
    }

    selectionClearBtn.addEventListener('click', clearSelection);

    // --- HUD Open/Close (double-tap/double-click to summon or dismiss) ---
    const hudEl = document.getElementById('lcars-hud');
    const hudHintEl = document.getElementById('lcars-hud-hint');
    let menuOpen = false;

    function openMenu() {
      if (menuOpen) return;
      menuOpen = true;
      hudEl.classList.add('is-open');
      hudHintEl.hidden = true;
    }

    function closeMenu() {
      if (!menuOpen) return;
      menuOpen = false;
      hudEl.classList.remove('is-open');
      hudHintEl.hidden = false;
    }

    // Unified double-click (mouse) / double-tap (touch) detection via Pointer
    // Events, so both input types share one code path instead of relying on
    // the (touch-unreliable) native 'dblclick' event. Shared by the scene
    // canvas (open the menu / select an entity) and the HUD itself (close it).
    const DOUBLE_TAP_MS = 350;
    const DOUBLE_TAP_PX = 28;

    function watchDoubleActivate(el, onDoubleActivate) {
      let last = { time: 0, x: 0, y: 0, pointerType: '' };
      el.addEventListener('pointerup', (e) => {
        const now = performance.now();
        const dx = e.clientX - last.x;
        const dy = e.clientY - last.y;
        const isDouble =
          (now - last.time) < DOUBLE_TAP_MS &&
          Math.hypot(dx, dy) < DOUBLE_TAP_PX &&
          e.pointerType === last.pointerType;

        if (isDouble) {
          onDoubleActivate(e);
          last.time = 0; // consume, so a triple tap doesn't re-trigger
        } else {
          last = { time: now, x: e.clientX, y: e.clientY, pointerType: e.pointerType };
        }
      });
    }

    watchDoubleActivate(renderer.domElement, (e) => {
      // First double-tap in the scene just summons the menu; once it's open,
      // double-tap goes back to selecting/deselecting whatever is under it.
      if (!menuOpen) {
        openMenu();
        return;
      }
      handleActivateAt(e.clientX, e.clientY);
    });

    watchDoubleActivate(hudEl, () => {
      if (menuOpen) closeMenu();
    });

    // --- Dynamic Updates Helper Functions ---
    function updateMaterials() {
      cubeMaterials[0].color.set(params.surfaceColors.parallelFaces);
      cubeMaterials[1].color.set(params.surfaceColors.parallelFaces);
      cubeMaterials[2].color.set(params.surfaceColors.parallelFaces);
      cubeMaterials[3].color.set(params.surfaceColors.parallelFaces);
      cubeMaterials[4].color.set(params.surfaceColors.outwardFace);
      cubeMaterials[5].color.set(params.surfaceColors.inwardFace);
    }

    function updateCubeScale() {
      cubes.forEach(cube => {
        cube.scale.set(params.cube.sizeX, params.cube.sizeY, params.cube.sizeZ);
      });
      floor.position.y = -params.cube.sizeY / 2;
    }

    // --- LCARS HUD: element builders ---
    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    function panelHeader(code, title) {
      const header = el('div', 'lcars-panel__header');
      header.appendChild(document.createTextNode(title));
      header.appendChild(el('span', 'lcars-panel__code', code));
      return header;
    }

    function createSliderPanel(container, opts) {
      const format = opts.format || (v => v);
      const panel = el('div', 'lcars-panel' + (opts.sub ? ' lcars-panel--sub' : ''));
      panel.appendChild(panelHeader(opts.code, opts.title));

      const valueEl = el('div', 'tool-value', format(opts.value));
      if (opts.unit) valueEl.appendChild(el('span', 'tool-value__unit', opts.unit));
      panel.appendChild(valueEl);

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'tool-slider';
      slider.min = opts.min;
      slider.max = opts.max;
      slider.step = opts.step;
      slider.value = opts.value;
      slider.addEventListener('input', () => {
        const v = parseFloat(slider.value);
        valueEl.childNodes[0].textContent = format(v);
        opts.onInput(v);
      });
      panel.appendChild(slider);

      container.appendChild(panel);
      return {
        refresh(v) {
          slider.value = v;
          valueEl.childNodes[0].textContent = format(v);
        }
      };
    }

    function createTogglePanel(container, opts) {
      const onLabel = opts.onLabel || 'ENABLED';
      const offLabel = opts.offLabel || 'DISABLED';
      const panel = el('div', 'lcars-panel');
      panel.appendChild(panelHeader(opts.code, opts.title));

      const row = el('div', 'tool-toggle-row');
      const valueEl = el('div', 'tool-value tool-value--text', opts.value ? onLabel : offLabel);
      const toggle = document.createElement('input');
      toggle.type = 'checkbox';
      toggle.className = 'tool-toggle';
      toggle.checked = opts.value;
      toggle.addEventListener('change', () => {
        valueEl.textContent = toggle.checked ? onLabel : offLabel;
        opts.onChange(toggle.checked);
      });
      row.appendChild(valueEl);
      row.appendChild(toggle);
      panel.appendChild(row);

      container.appendChild(panel);
      return {
        refresh(v) {
          toggle.checked = v;
          valueEl.textContent = v ? onLabel : offLabel;
        }
      };
    }

    function createSelectPanel(container, opts) {
      const labels = opts.labels || {};
      const panel = el('div', 'lcars-panel');
      panel.appendChild(panelHeader(opts.code, opts.title));

      const valueEl = el('div', 'tool-value tool-value--text', opts.value);
      panel.appendChild(valueEl);

      const optsRow = el('div', 'tool-select');
      const buttons = opts.options.map(optVal => {
        const btn = el('button', 'tool-select__opt' + (optVal === opts.value ? ' is-active' : ''), labels[optVal] || optVal);
        btn.type = 'button';
        btn.dataset.value = optVal;
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          valueEl.textContent = optVal;
          opts.onChange(optVal);
        });
        optsRow.appendChild(btn);
        return btn;
      });
      panel.appendChild(optsRow);

      container.appendChild(panel);
      return {
        refresh(v) {
          valueEl.textContent = v;
          buttons.forEach(b => b.classList.toggle('is-active', b.dataset.value === v));
        }
      };
    }

    function createColorPanel(container, opts) {
      const panel = el('div', 'lcars-panel');
      panel.appendChild(panelHeader(opts.code, opts.title));

      const row = el('div', 'tool-color-row');
      const valueEl = el('div', 'tool-value tool-value--text', opts.value.toUpperCase());
      const swatch = document.createElement('input');
      swatch.type = 'color';
      swatch.className = 'tool-color-swatch';
      swatch.value = opts.value;
      swatch.addEventListener('input', () => {
        valueEl.textContent = swatch.value.toUpperCase();
        opts.onChange(swatch.value);
      });
      row.appendChild(swatch);
      row.appendChild(valueEl);
      panel.appendChild(row);

      container.appendChild(panel);
      return {
        refresh(v) {
          swatch.value = v;
          valueEl.textContent = v.toUpperCase();
        }
      };
    }

    function createFilePanel(container, opts) {
      const panel = el('div', 'lcars-panel');
      panel.style.display = opts.visible ? '' : 'none';
      panel.appendChild(panelHeader(opts.code, opts.title));

      const valueEl = el('div', 'tool-value tool-value--text', opts.value || 'NO FILE LOADED');
      panel.appendChild(valueEl);

      const input = document.createElement('input');
      input.type = 'file';
      input.className = 'tool-file';
      if (opts.accept) input.accept = opts.accept;
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (file) {
          valueEl.textContent = file.name.toUpperCase();
          opts.onChange(file);
        }
      });
      panel.appendChild(input);

      container.appendChild(panel);
      return {
        setVisible(v) { panel.style.display = v ? '' : 'none'; },
        refresh(v) { valueEl.textContent = v; }
      };
    }

    // --- LCARS HUD: menu + tabs scaffold ---
    const hudMenu = document.getElementById('lcars-menu');
    const hudPanels = document.getElementById('lcars-tabpanels');

    const TABS = [
      { id: 'source', label: 'Source', accent: '#ff9c00' },
      { id: 'orbit', label: 'Orbit', accent: '#cc99cc' },
      { id: 'cube', label: 'Cube', accent: '#9999ff' },
      { id: 'surface', label: 'Surface', accent: '#ffcc66' },
      { id: 'runner', label: 'Runner', accent: '#ff6666' },
      { id: 'camera', label: 'Camera', accent: '#66ccff' }
    ];

    const tabPanelEls = {};
    TABS.forEach((tab, i) => {
      const btn = el('button', 'lcars-tab' + (i === 0 ? ' is-active' : ''), tab.label);
      btn.type = 'button';
      btn.style.setProperty('--tab-accent', tab.accent);
      btn.addEventListener('click', () => activateTab(tab.id));
      hudMenu.appendChild(btn);
      tab.btn = btn;

      const panelEl = el('div', 'lcars-tabpanel' + (i === 0 ? ' is-active' : ''));
      panelEl.style.setProperty('--accent', tab.accent);
      hudPanels.appendChild(panelEl);
      tabPanelEls[tab.id] = panelEl;
    });

    function activateTab(id) {
      TABS.forEach(tab => {
        const active = tab.id === id;
        tab.btn.classList.toggle('is-active', active);
        tabPanelEls[tab.id].classList.toggle('is-active', active);
      });
    }

    const sourceTab = tabPanelEls.source;
    const orbitTab = tabPanelEls.orbit;
    const cubeTab = tabPanelEls.cube;
    const surfaceTab = tabPanelEls.surface;
    const runnerTab = tabPanelEls.runner;
    const cameraTab = tabPanelEls.camera;

    // 1. Central Source — the construct's core, everything else is built around it
    createColorPanel(sourceTab, { code: 'SRC-01', title: 'Source Color', value: params.source.color, onChange: c => {
      params.source.color = c;
      centralPointLight.color.set(c);
      sourceMeshMat.color.set(c);
    }});
    createSliderPanel(sourceTab, { code: 'SRC-02', title: 'Intensity', unit: '×', min: 0, max: 10, step: 0.1, value: params.source.intensity, format: v => v.toFixed(1), onInput: v => {
      params.source.intensity = v;
      centralPointLight.intensity = v;
    }});
    createSliderPanel(sourceTab, { code: 'SRC-03', title: 'Source Size', unit: 'u', min: 0.1, max: 10, step: 0.1, value: params.source.size, format: v => v.toFixed(1), onInput: v => {
      params.source.size = v;
      sourceMesh.scale.setScalar(v);
    }});
    createSliderPanel(sourceTab, { code: 'SRC-04', title: 'Light Range', unit: 'u', min: 10, max: 300, step: 1, value: params.source.distance, format: v => Math.round(v), onInput: v => {
      params.source.distance = v;
      centralPointLight.distance = v;
    }});

    // 2. Orbit & Central Cog — the structural mechanism orbiting the source
    createSliderPanel(orbitTab, { code: 'ORB-01', title: 'Cube Count', unit: 'n', min: 3, max: 24, step: 1, value: params.orbit.count, format: v => Math.round(v), onInput: v => {
      params.orbit.count = Math.round(v);
      buildOrbitingCubes();
    }});
    createSliderPanel(orbitTab, { code: 'ORB-02', title: 'Orbit Radius', unit: 'u', min: 10, max: 100, step: 0.5, value: params.orbit.radius, format: v => v.toFixed(1), onInput: v => {
      params.orbit.radius = v;
      buildOrbitingCubes();
    }});
    createSliderPanel(orbitTab, { code: 'ORB-03', title: 'Orbit Speed', unit: 'rad/s', min: -2.0, max: 2.0, step: 0.01, value: params.orbit.speed, format: v => v.toFixed(2), onInput: v => {
      params.orbit.speed = v;
    }});
    createSliderPanel(orbitTab, { code: 'ORB-04', title: 'Cog System Scale', unit: '×', min: 0.1, max: 5.0, step: 0.1, value: params.orbit.cogSize, format: v => v.toFixed(1), onInput: v => {
      params.orbit.cogSize = v;
      orbitGroup.scale.set(v, 1, v);
    }});

    // 3. Cube Entity Dimensions — geometry of the orbiting units themselves
    createTogglePanel(cubeTab, { code: 'CUB-01', title: 'Lock XYZ Proportions', value: params.cube.proportionalLock, onLabel: 'LOCKED', offLabel: 'UNLOCKED', onChange: v => {
      params.cube.proportionalLock = v;
    }});
    createSliderPanel(cubeTab, { code: 'CUB-02', title: 'Uniform Size', unit: 'u', min: 0.5, max: 20, step: 0.1, value: params.cube.uniformScale, format: v => v.toFixed(1), onInput: v => {
      params.cube.uniformScale = v;
      if (params.cube.proportionalLock) {
        params.cube.sizeX = v;
        params.cube.sizeY = v;
        params.cube.sizeZ = v;
        cXPanel.refresh(v);
        cYPanel.refresh(v);
        cZPanel.refresh(v);
        updateCubeScale();
      }
    }});
    const cXPanel = createSliderPanel(cubeTab, { code: 'CUB-03', title: 'Dimension X', unit: 'u', min: 0.5, max: 30, step: 0.1, value: params.cube.sizeX, format: v => v.toFixed(1), sub: true, onInput: v => {
      params.cube.sizeX = v;
      if (!params.cube.proportionalLock) updateCubeScale();
    }});
    const cYPanel = createSliderPanel(cubeTab, { code: 'CUB-04', title: 'Dimension Y', unit: 'u', min: 0.5, max: 30, step: 0.1, value: params.cube.sizeY, format: v => v.toFixed(1), sub: true, onInput: v => {
      params.cube.sizeY = v;
      if (!params.cube.proportionalLock) updateCubeScale();
    }});
    const cZPanel = createSliderPanel(cubeTab, { code: 'CUB-05', title: 'Dimension Z', unit: 'u', min: 0.5, max: 30, step: 0.1, value: params.cube.sizeZ, format: v => v.toFixed(1), sub: true, onInput: v => {
      params.cube.sizeZ = v;
      if (!params.cube.proportionalLock) updateCubeScale();
    }});

    // 4. Surface Colors — material finish applied on top of the geometry
    createSelectPanel(surfaceTab, {
      code: 'SRF-01',
      title: 'Palette Preset',
      options: ['Default (Black/Grey/White)', 'High Contrast Inverted', 'Monochrome Dark'],
      labels: {
        'Default (Black/Grey/White)': 'Default',
        'High Contrast Inverted': 'Inverted',
        'Monochrome Dark': 'Mono Dark'
      },
      value: params.surfaceColors.preset,
      onChange: v => {
        params.surfaceColors.preset = v;
        if (v === 'Default (Black/Grey/White)') {
          params.surfaceColors.inwardFace = '#ffffff';
          params.surfaceColors.outwardFace = '#000000';
          params.surfaceColors.parallelFaces = '#808080';
        } else if (v === 'High Contrast Inverted') {
          params.surfaceColors.inwardFace = '#000000';
          params.surfaceColors.outwardFace = '#ffffff';
          params.surfaceColors.parallelFaces = '#444444';
        } else if (v === 'Monochrome Dark') {
          params.surfaceColors.inwardFace = '#888888';
          params.surfaceColors.outwardFace = '#111111';
          params.surfaceColors.parallelFaces = '#333333';
        }
        inwardPanel.refresh(params.surfaceColors.inwardFace);
        outwardPanel.refresh(params.surfaceColors.outwardFace);
        parallelPanel.refresh(params.surfaceColors.parallelFaces);
        updateMaterials();
      }
    });
    const inwardPanel = createColorPanel(surfaceTab, { code: 'SRF-02', title: 'Inward Face (Center)', value: params.surfaceColors.inwardFace, onChange: c => {
      params.surfaceColors.inwardFace = c;
      updateMaterials();
    }});
    const outwardPanel = createColorPanel(surfaceTab, { code: 'SRF-03', title: 'Outward Face (Away)', value: params.surfaceColors.outwardFace, onChange: c => {
      params.surfaceColors.outwardFace = c;
      updateMaterials();
    }});
    const parallelPanel = createColorPanel(surfaceTab, { code: 'SRF-04', title: 'Parallel Faces (Horizon/Side)', value: params.surfaceColors.parallelFaces, onChange: c => {
      params.surfaceColors.parallelFaces = c;
      updateMaterials();
    }});

    // 5. Runner — the moving entity travelling the construct
    createTogglePanel(runnerTab, { code: 'RUN-01', title: 'Enable Run Path', value: params.runner.active, onLabel: 'ACTIVE', offLabel: 'STANDBY', onChange: v => {
      params.runner.active = v;
    }});
    createSelectPanel(runnerTab, {
      code: 'RUN-02',
      title: 'Runner Shape',
      options: ['Rectifier', 'Sphere', 'Cube', 'Custom'],
      labels: { Custom: 'Custom (STL/OBJ)' },
      value: params.runner.shape,
      onChange: v => {
        params.runner.shape = v;
        applyRunnerShape(v);
        customModelPanel.setVisible(v === 'Custom');
      }
    });
    const customModelPanel = createFilePanel(runnerTab, {
      code: 'RUN-03',
      title: 'Custom Model',
      accept: '.stl,.obj',
      visible: params.runner.shape === 'Custom',
      onChange: file => loadCustomRunnerFile(file)
    });
    createSliderPanel(runnerTab, { code: 'RUN-04', title: 'Runner Size', unit: '×', min: 0.1, max: 5.0, step: 0.05, value: params.runner.size, format: v => v.toFixed(2), onInput: v => {
      params.runner.size = v;
      runnerGroup.scale.setScalar(v);
    }});
    createSliderPanel(runnerTab, { code: 'RUN-05', title: 'Path Center X', unit: 'u', min: -60, max: 60, step: 0.5, value: params.runner.path.x, format: v => v.toFixed(1), sub: true, onInput: v => {
      params.runner.path.x = v;
    }});
    createSliderPanel(runnerTab, { code: 'RUN-06', title: 'Path Center Y', unit: 'u', min: -20, max: 20, step: 0.5, value: params.runner.path.y, format: v => v.toFixed(1), sub: true, onInput: v => {
      params.runner.path.y = v;
    }});
    createSliderPanel(runnerTab, { code: 'RUN-07', title: 'Path Center Z', unit: 'u', min: -60, max: 60, step: 0.5, value: params.runner.path.z, format: v => v.toFixed(1), sub: true, onInput: v => {
      params.runner.path.z = v;
    }});
    createSliderPanel(runnerTab, { code: 'RUN-08', title: 'Path Length', unit: 'u', min: 10, max: 150, step: 1, value: params.runner.pathLength, format: v => Math.round(v), onInput: v => {
      params.runner.pathLength = v;
    }});
    createSliderPanel(runnerTab, { code: 'RUN-09', title: 'Run Speed', unit: 'u/s', min: 1.0, max: 40.0, step: 0.5, value: params.runner.speed, format: v => v.toFixed(1), onInput: v => {
      params.runner.speed = v;
    }});
    createColorPanel(runnerTab, { code: 'RUN-10', title: 'Runner Color', value: params.runner.color, onChange: c => {
      params.runner.color = c;
      runnerBodyMat.color.set(c);
      limbMat.color.set(c);
    }});

    // 6. Camera — the observer's viewpoint onto everything above
    createSelectPanel(cameraTab, {
      code: 'CAM-01',
      title: 'Perspective',
      options: ['Runner Tracking', 'Free Orbit Overview', 'Static Origin View', 'Manual Control'],
      labels: {
        'Runner Tracking': 'Runner',
        'Free Orbit Overview': 'Free Orbit',
        'Static Origin View': 'Static',
        'Manual Control': 'Manual'
      },
      value: params.camera.trackingMode,
      onChange: v => {
        params.camera.trackingMode = v;
        controls.enabled = (v === 'Manual Control');
        if (controls.enabled) {
          // Pick up wherever the camera currently is instead of snapping
          controls.target.set(0, runnerGroup.position.y, 0);
          controls.update();
        }
      }
    });
    createSliderPanel(cameraTab, { code: 'CAM-02', title: 'Camera FOV', unit: '°', min: 20, max: 100, step: 1, value: params.camera.fov, format: v => Math.round(v), onInput: v => {
      params.camera.fov = v;
      camera.fov = v;
      camera.updateProjectionMatrix();
    }});
    createSliderPanel(cameraTab, { code: 'CAM-03', title: 'Follow Distance', unit: 'u', min: 2, max: 40, step: 0.5, value: params.camera.distance, format: v => v.toFixed(1), onInput: v => {
      params.camera.distance = v;
    }});
    createSliderPanel(cameraTab, { code: 'CAM-04', title: 'Follow Height', unit: 'u', min: 0.5, max: 20, step: 0.5, value: params.camera.height, format: v => v.toFixed(1), onInput: v => {
      params.camera.height = v;
    }});

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      // Orbit Rotation
      orbitGroup.rotation.y += params.orbit.speed * delta;

      // Runner Motion along Z, relative to its configurable path center
      if (params.runner.active) {
        runnerDistance -= params.runner.speed * delta;
        // Stop before colliding directly into the light source, loop back
        const stopDistance = (params.orbit.radius * params.orbit.cogSize) - (params.cube.sizeZ / 2) - 2;
        if (runnerDistance < Math.max(stopDistance, 2.0)) {
          runnerDistance = params.runner.pathLength;
        }
        runnerGroup.position.set(
          params.runner.path.x,
          params.runner.path.y,
          params.runner.path.z + runnerDistance
        );

        // Articulated leg swing (Rectifier shape only)
        if (runnerLegs) {
          const swing = Math.sin(elapsedTime * params.runner.speed * 1.5) * 0.6;
          runnerLegs.left.rotation.x = swing;
          runnerLegs.right.rotation.x = -swing;
        }
      }

      // Camera Positioning Modes
      if (params.camera.trackingMode === 'Runner Tracking') {
        const camX = runnerGroup.position.x;
        const camZ = runnerGroup.position.z + params.camera.distance;
        const camY = runnerGroup.position.y + params.camera.height;
        camera.position.set(camX, camY, camZ);
        camera.lookAt(runnerGroup.position.x, runnerGroup.position.y + 1, 0); // Track straight down the runner's lane toward the light
      } else if (params.camera.trackingMode === 'Free Orbit Overview') {
        const angle = elapsedTime * 0.1;
        const dist = params.orbit.radius * 2.2;
        camera.position.set(Math.cos(angle) * dist, 25, Math.sin(angle) * dist);
        camera.lookAt(0, 0, 0);
      } else if (params.camera.trackingMode === 'Static Origin View') {
        camera.position.set(0, 5, params.orbit.radius * 1.8);
        camera.lookAt(0, 0, 0);
      } else if (params.camera.trackingMode === 'Manual Control') {
        // Mouse-drag / touch-drag orbit, wheel / pinch zoom
        controls.update();
      }

      // Keep the selection outline glued to its (possibly moving) target
      if (selectionHelper) {
        scene.updateMatrixWorld();
        selectionHelper.update();
      }

      renderer.render(scene, camera);
    }

    // --- Resize Handler ---
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    animate();
  </script>
</body>
</html>
