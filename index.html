      ALL_CORNER_PANELS.push(instance);
      return instance;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      ALL_CORNER_PANELS.forEach(p => { if (p.isOpen()) p.setOpen(false); });
    });

    const objectsPanel = createCornerPanel({ id: 'objects', corner: 'tl', label: 'Objects', accent: LCARS_PALETTE.periwinkle });
    const appearancePanel = createCornerPanel({ id: 'appearance', corner: 'bl', label: 'Appearance', accent: LCARS_PALETTE.gold });
    const cameraPanel = createCornerPanel({ id: 'camera', corner: 'tr', label: 'Camera', accent: LCARS_PALETTE.ice });
    const memoryPanel = createCornerPanel({ id: 'memory', corner: 'br', label: 'Files', accent: LCARS_PALETTE.plum });

    // Camera's header is always on screen (open or collapsed), so the
    // stardate readout and the sound toggle live there rather than buried
    // in any one panel's collapsible body.
    cameraPanel.headerRow.appendChild(stardateEl);
    cameraPanel.headerRow.appendChild(audioToggleBtn);

    // The selection bar sits directly in the Objects panel body, above a
    // nested sub-container that renderObjectsTab() tears down and rebuilds
    // on every structural change — keeping the bar itself untouched by
    // those rebuilds.
    objectsPanel.body.appendChild(selectionBar);
    const objectsTab = el('div', 'lcars-corner-content');
    objectsPanel.body.appendChild(objectsTab);

    const appearanceTab = appearancePanel.body;
    const cameraTab = cameraPanel.body;
    const memoryTab = memoryPanel.body;

    // 1. Objects — the dynamic hierarchy: a chip row (one per object, "+"
    // to add another) and a detail panel for whichever object is focused.
    // Full teardown-and-rebuild on any structural change (add/remove/
    // rename/reparent/reshape) rather than trying to rebind existing
    // panels' closures to a different target object — simpler and cheap
    // enough for HUD-sized DOM.
    function renderObjectsTab() {
      objectsTab.innerHTML = '';

      const chipRow = el('div', 'tool-object-row');
      params.objects.forEach(obj => {
        const chip = el('button', 'tool-object-chip' + (obj.id === focusedObjectId ? ' is-focused' : ''), objectDisplayName(obj));
        chip.type = 'button';
        chip.style.color = obj.color;
        chip.style.background = dimHex(obj.color, 0.8);
        chip.setAttribute('aria-pressed', obj.id === focusedObjectId ? 'true' : 'false');
        chip.addEventListener('click', () => {
          // Picking a chip is "selecting" that object exactly like a
          // double-tap in the 3D scene is — not a separate, weaker
          // "just show its panel" action. Routing through setSelection()
          // (rather than only setting focusedObjectId) is what makes
          // Camera → Follow Selected, the selection highlight, and the
          // selection bar all pick it up too; setSelection() itself
          // already re-focuses+re-renders this tab, so there's nothing
          // left to do here afterward.
          const rt = objectRuntime.get(obj.id);
          if (rt) {
            setSelection({ root: rt.root, label: objectDisplayName(obj), objectId: obj.id });
            playConfirm();
          } else {
            focusedObjectId = obj.id;
            renderObjectsTab();
            playTick();
          }
        });
        chipRow.appendChild(chip);
      });
      const addChip = el('button', 'tool-object-chip tool-object-chip--add', '+');
      addChip.type = 'button';
      addChip.setAttribute('aria-label', 'Add stellar object');
      addChip.addEventListener('click', () => addObject('PLANET'));
      chipRow.appendChild(addChip);
      objectsTab.appendChild(chipRow);

      const obj = params.objects.find(o => o.id === focusedObjectId);
      if (!obj) {
        objectsTab.appendChild(el('div', 'tool-program-empty', 'No object selected'));
        return;
      }
      const meta = OBJECT_TYPES[obj.type];
      const byId = new Map(params.objects.map(o => [o.id, o]));

      createTextFieldPanel(objectsTab, { code: 'OBJ-01', title: 'Name', value: obj.name, onChange: v => {
        obj.name = v;
        renderObjectsTab();
      }});

      createSelectPanel(objectsTab, { code: 'OBJ-02', title: 'Type', options: OBJECT_TYPE_ORDER, labels: OBJECT_TYPE_LABELS, value: obj.type, onChange: v => {
        const newMeta = OBJECT_TYPES[v];
        obj.type = v;
        obj.mass = newMeta.defaultMass;
        obj.size = newMeta.defaultSize;
        obj.shape = newMeta.defaultShape;
        obj.color = newMeta.color;
        rebuildObjectVisual(obj.id);
        renderObjectsTab();
      }});

      const parentOptions = ['NONE'].concat(
        params.objects.filter(o => o.id !== obj.id && !isDescendantOf(o.id, obj.id, byId)).map(o => o.id)
      );
      const parentLabels = { NONE: 'None (Fixed Center)' };
      params.objects.forEach(o => { parentLabels[o.id] = objectDisplayName(o); });
      createSelectPanel(objectsTab, { code: 'OBJ-03', title: 'Parent', options: parentOptions, labels: parentLabels, value: obj.parentId || 'NONE', onChange: v => {
        obj.parentId = v === 'NONE' ? null : v;
        reseedObjectOrbit(obj);
        rebuildHierarchyOrder();
        renderObjectsTab();
      }});

      createSliderPanel(objectsTab, { code: 'OBJ-04', title: 'Mass', unit: '', min: meta.massRange[0], max: meta.massRange[1], step: (meta.massRange[1] - meta.massRange[0]) / 300, value: obj.mass, format: v => v.toFixed(2), onInput: v => {
        // Live: children pick up the new pull next physics tick, no reseed
        // needed — and no visible child path needs redrawing either. Orbit
        // shape here is seeded as speedRatio × *local* circular velocity,
        // and that ratio cancels mu out of both the semi-major axis and
        // eccentricity formulas entirely (a = r0/(2 − speedRatio²), no mu
        // term) — a heavier parent makes the same-shaped orbit traverse
        // faster, never a differently-shaped one.
        obj.mass = v;
      }});

      createSliderPanel(objectsTab, { code: 'OBJ-05', title: 'Size', unit: 'u', min: meta.sizeRange[0], max: meta.sizeRange[1], step: (meta.sizeRange[1] - meta.sizeRange[0]) / 150, value: obj.size, format: v => v.toFixed(2), onInput: v => {
        obj.size = v;
        const rt = objectRuntime.get(obj.id);
        if (rt) rt.root.scale.setScalar(1).multiplyScalar(v); // cheap in-place rescale, no rebuild
      }});

      createSelectPanel(objectsTab, { code: 'OBJ-06', title: 'Shape', options: ['Cube', 'Sphere', 'Prism', 'Starship', 'Custom'], value: obj.shape, onChange: v => {
        obj.shape = v;
        rebuildObjectVisual(obj.id);
        renderObjectsTab();
      }});
      if (obj.shape === 'Custom') {
        createFilePanel(objectsTab, { code: 'OBJ-07', title: 'Custom Model', accept: '.stl,.obj', visible: true, onChange: file => loadCustomObjectFile(obj.id, file) });
      }

      createColorPanel(objectsTab, { code: 'OBJ-08', title: 'Color', value: obj.color, onChange: c => {
        obj.color = c;
        const rt = objectRuntime.get(obj.id);
        if (rt) rt.allMeshes.forEach(m => { if (m.material && m.material.color) m.material.color.set(c); });
      }});

      if (obj.parentId) {
        const parentObj = byId.get(obj.parentId);
        const minDist = minOrbitDistanceFor(obj, parentObj);
        // Self-heal an already-invalid stored distance (an old save, or a
        // parent/self Size change since this was last set) instead of just
        // raising the slider's floor out from under a value that's still
        // sitting below it.
        if (obj.orbit.distance < minDist) {
          obj.orbit.distance = minDist;
          reseedObjectOrbit(obj);
        }
        createSliderPanel(objectsTab, { code: 'OBJ-09', title: 'Orbit Distance', unit: 'u', min: minDist, max: 200, step: 0.5, value: obj.orbit.distance, format: v => v.toFixed(1), sub: true, onInput: v => {
          obj.orbit.distance = v;
          reseedObjectOrbit(obj);
        }});
        createSliderPanel(objectsTab, { code: 'OBJ-10', title: 'Orbit Speed', unit: '× circular', min: 0.1, max: 2.0, step: 0.05, value: obj.orbit.speedRatio, format: v => v.toFixed(2), sub: true, onInput: v => {
          obj.orbit.speedRatio = v;
          reseedObjectOrbit(obj);
        }});
        createSliderPanel(objectsTab, { code: 'OBJ-11', title: 'Orbit Angle', unit: '°', min: 0, max: 360, step: 1, value: obj.orbit.angleDeg, format: v => Math.round(v), sub: true, onInput: v => {
          obj.orbit.angleDeg = v;
          reseedObjectOrbit(obj);
        }});
        createColorPanel(objectsTab, { code: 'OBJ-12', title: 'Path Color', value: obj.pathColor || obj.color, sub: true, onChange: c => {
          obj.pathColor = c;
          if (obj.pathVisible) rebuildOrbitPathLine(obj);
        }});
        createTogglePanel(objectsTab, { code: 'OBJ-13', title: 'Light Orbit Path', value: !!obj.pathVisible, onLabel: 'LIT', offLabel: 'DARK', onChange: v => {
          obj.pathVisible = v;
          rebuildOrbitPathLine(obj); // handles both showing and (via the !pathVisible no-op + dispose above) hiding
        }});

        // Orbital Telemetry — Dr. Tyson's ask: real numbers, not just a
        // moving shape. Seeded here with the current values, then kept
        // live by the existing once-a-second telemetry ticker (see
        // updateOrbitalTelemetryReadout) rather than a new timer.
        const parentRtForTel = objectRuntime.get(obj.parentId);
        const muForTel = parentRtForTel ? Math.max(0.5, parentRtForTel.config.mass) : 0.5;
        const telElements = computeOrbitElements(muForTel, obj.orbit.distance, obj.orbit.angleDeg, obj.orbit.speedRatio);
        const telRt = objectRuntime.get(obj.id);
        const liveDist = telRt && telRt.gState ? Math.hypot(telRt.gState.x, telRt.gState.z) : obj.orbit.distance;
        const liveSpeed = telRt && telRt.gState ? Math.hypot(telRt.gState.vx, telRt.gState.vz) : 0;

        const telPanel = el('div', 'lcars-panel lcars-panel--sub');
        const { headerEl: telHeader } = panelHeader('OBJ-14', 'Orbital Telemetry');
        telPanel.appendChild(telHeader);
        const telGrid = el('div', 'tool-telemetry-grid');
        [
          ['period', 'PERIOD', telElements.period !== null ? telElements.period.toFixed(1) + ' s' : 'UNBOUND'],
          ['speed', 'SPEED', liveSpeed.toFixed(2) + ' u/s'],
          ['distance', 'DISTANCE', liveDist.toFixed(1) + ' u'],
          ['eccentricity', 'ECCENTRICITY', telElements.e.toFixed(3)]
        ].forEach(([key, label, text]) => {
          const row = el('div', 'tool-telemetry-row');
          row.appendChild(el('span', 'tool-telemetry-label', label));
          const val = el('span', 'tool-telemetry-value', text);
          val.dataset.telemetry = key;
          row.appendChild(val);
          telGrid.appendChild(row);
        });
        telPanel.appendChild(telGrid);
        objectsTab.appendChild(telPanel);
      }

      const deleteWrap = el('div', 'lcars-panel');
      const { headerEl } = panelHeader('OBJ-15', 'Remove');
      deleteWrap.appendChild(headerEl);
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'tool-text-button';
      deleteBtn.textContent = 'Delete Object';
      deleteBtn.disabled = params.objects.length <= 1;
      deleteBtn.addEventListener('click', () => removeObject(obj.id));
      deleteWrap.appendChild(deleteBtn);
      objectsTab.appendChild(deleteWrap);
    }

    renderObjectsTab();

    // 2. Camera — the observer's viewpoint onto the hierarchy above
    createSelectPanel(cameraTab, {
      code: 'CAM-01',
      title: 'Perspective',
      options: ['Free Orbit Overview', 'Follow Selected', 'Static Origin View', 'Manual Control'],
      value: params.camera.trackingMode,
      onChange: v => {
        params.camera.trackingMode = v;
        controls.enabled = (v === 'Manual Control');
        if (controls.enabled) {
          controls.target.set(0, 0, 0);
          controls.update();
        }
      }
    });
    createSliderPanel(cameraTab, { code: 'CAM-02', title: 'Camera FOV', unit: '°', min: 20, max: 100, step: 1, value: params.camera.fov, format: v => Math.round(v), onInput: v => {
      params.camera.fov = v;
      camera.fov = v;
      camera.updateProjectionMatrix();
    }});
    createSliderPanel(cameraTab, { code: 'CAM-03', title: 'Follow Distance', unit: 'u', min: 2, max: 60, step: 0.5, value: params.camera.distance, format: v => v.toFixed(1), onInput: v => {
      params.camera.distance = v;
    }});
    createSliderPanel(cameraTab, { code: 'CAM-04', title: 'Follow Height', unit: 'u', min: 0.5, max: 30, step: 0.5, value: params.camera.height, format: v => v.toFixed(1), onInput: v => {
      params.camera.height = v;
    }});

    // 3. Appearance — how the construct is rendered: shading style, plus
    // "master" orbit-path controls that apply to every object at once
    // instead of visiting each one individually on the Objects panel. Not
    // a persistent override layer — after applying, each object's own
    // Path Color/Light Orbit Path controls remain the live source of
    // truth and can still be adjusted individually.
    createSelectPanel(appearanceTab, {
      code: 'APR-01',
      title: 'Lighting Mode',
      options: ['Shaded', 'Posterized', 'Flat Light'],
      value: params.lightingMode,
      onChange: v => {
        params.lightingMode = v;
        applyLightingModeToAllObjects();
      }
    });
    createColorPanel(appearanceTab, { code: 'APR-02', title: 'Set All Path Colors', value: '#33ffff', onChange: c => {
      params.objects.forEach(o => {
        if (!o.parentId) return;
        o.pathColor = c;
        if (o.pathVisible) rebuildOrbitPathLine(o);
      });
      renderObjectsTab(); // refresh the focused object's own Path Color panel if it changed
    }});
    createTogglePanel(appearanceTab, {
      code: 'APR-03',
      title: 'Light All Orbit Paths',
      value: params.objects.length > 0 && params.objects.filter(o => o.parentId).every(o => o.pathVisible),
      onLabel: 'ALL LIT',
      offLabel: 'ALL DARK',
      onChange: v => {
        params.objects.forEach(o => {
          if (!o.parentId) return;
          o.pathVisible = v;
          rebuildOrbitPathLine(o);
        });
        renderObjectsTab(); // refresh the focused object's own Light Orbit Path toggle
      }
    });

    // 4. Memory — "Computer, save current program." Local named saves, plus
    // a portable export/import code for taking a program to another browser.
    function createSaveProgramPanel(container, onSave) {
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader('MEM-01', 'Save Current Program');
      panel.appendChild(headerEl);

      const statusEl = el('div', 'tool-value tool-value--text', 'ENTER A NAME');
      panel.appendChild(statusEl);

      const row = el('div', 'tool-text-row');
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'tool-text-input';
      input.placeholder = 'Program name';
      input.maxLength = 40;
      input.setAttribute('aria-labelledby', titleId);
      row.appendChild(input);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-text-button';
      btn.textContent = 'Save';
      const submit = () => {
        playTick();
        const name = input.value.trim();
        if (!name) { statusEl.textContent = 'ENTER A NAME'; return; }
        onSave(name, statusEl, () => { input.value = ''; });
      };
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      row.appendChild(btn);

      panel.appendChild(row);
      container.appendChild(panel);
    }

    function createProgramListPanel(container) {
      const panel = el('div', 'lcars-panel');
      const { headerEl } = panelHeader('MEM-02', 'Stored Programs');
      panel.appendChild(headerEl);

      const list = el('div', 'tool-program-list');
      panel.appendChild(list);
      container.appendChild(panel);

      function refresh() {
        const programs = listPrograms();
        const names = Object.keys(programs).sort();
        list.innerHTML = '';
        if (names.length === 0) {
          list.appendChild(el('div', 'tool-program-empty', 'No programs stored'));
          return;
        }
        names.forEach(name => {
          const row = el('div', 'tool-program-row');
          row.appendChild(el('span', 'tool-program-name', name));

          const loadBtn = document.createElement('button');
          loadBtn.type = 'button';
          loadBtn.className = 'tool-program-load';
          loadBtn.textContent = 'Load';
          loadBtn.setAttribute('aria-label', 'Load saved program ' + name);
          loadBtn.addEventListener('click', () => loadProgram(name));
          row.appendChild(loadBtn);

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'tool-program-delete';
          delBtn.textContent = '✕';
          delBtn.setAttribute('aria-label', 'Delete saved program ' + name);
          delBtn.addEventListener('click', () => {
            playTick();
            deleteProgram(name);
            refresh();
          });
          row.appendChild(delBtn);

          list.appendChild(row);
        });
      }

      refresh();
      return { refresh };
    }

    function createExportPanel(container) {
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader('MEM-03', 'Export Code');
      panel.appendChild(headerEl);

      const statusEl = el('div', 'tool-value tool-value--text', 'Generate a code to share');
      panel.appendChild(statusEl);

      const textarea = document.createElement('textarea');
      textarea.className = 'tool-textarea';
      textarea.readOnly = true;
      textarea.placeholder = 'Press Generate to create a shareable code…';
      textarea.setAttribute('aria-labelledby', titleId);
      panel.appendChild(textarea);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-text-button';
      btn.textContent = 'Generate + Copy';
      btn.addEventListener('click', () => {
        playTick();
        const code = exportProgramCode(snapshotParams());
        textarea.value = code;
        textarea.select();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code)
            .then(() => { statusEl.textContent = 'Copied to clipboard'; })
            .catch(() => { statusEl.textContent = 'Code ready — copy manually'; });
        } else {
          statusEl.textContent = 'Code ready — copy manually';
        }
      });
      panel.appendChild(btn);

      container.appendChild(panel);
    }

    function createImportPanel(container) {
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader('MEM-04', 'Import Code');
      panel.appendChild(headerEl);

      const statusEl = el('div', 'tool-value tool-value--text', 'Paste a code below');
      panel.appendChild(statusEl);

      const textarea = document.createElement('textarea');
      textarea.className = 'tool-textarea';
      textarea.placeholder = 'Paste an exported code here…';
      textarea.setAttribute('aria-labelledby', titleId);
      panel.appendChild(textarea);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-text-button';
      btn.textContent = 'Import + Reload';
      btn.addEventListener('click', () => {
        const snapshot = importProgramFromCode(textarea.value);
        if (!snapshot) { statusEl.textContent = 'Invalid code'; return; }
        if (!safeLocalStorageSet(PENDING_LOAD_KEY, JSON.stringify(snapshot))) {
          statusEl.textContent = 'Storage unavailable';
          return;
        }
        location.reload();
      });
      panel.appendChild(btn);

      container.appendChild(panel);
    }

    createSaveProgramPanel(memoryTab, (name, statusEl, clearInput) => {
      const existed = Object.prototype.hasOwnProperty.call(listPrograms(), name);
      if (saveProgram(name)) {
        clearInput();
        programListPanel.refresh();
        statusEl.textContent = (existed ? 'Overwritten: ' : 'Saved: ') + name;
      } else {
        statusEl.textContent = 'Storage unavailable';
      }
    });
    const programListPanel = createProgramListPanel(memoryTab);
    createExportPanel(memoryTab);
    createImportPanel(memoryTab);

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      updateObjectsPhysics(delta);

      // Camera Positioning Modes
      const rootObj = hierarchyOrderCache[0];
      const maxOrbitDistance = params.objects.reduce((m, o) => Math.max(m, o.orbit.distance || 0), 20);

      if (params.camera.trackingMode === 'Follow Selected') {
        const targetId = selectedObjectId || (rootObj && rootObj.id);
        const rt = targetId ? objectRuntime.get(targetId) : null;
        if (rt) {
          let fx = 0.7, fz = 0.7; // default trailing direction for a stationary (e.g. root) target
          if (rt.gState) {
            const sp = Math.hypot(rt.gState.vx, rt.gState.vz);
            if (sp > 1e-4) { fx = rt.gState.vx / sp; fz = rt.gState.vz / sp; }
          }
          camera.position.set(rt.absX - fx * params.camera.distance, rt.absY + params.camera.height, rt.absZ - fz * params.camera.distance);
          camera.lookAt(rt.absX, rt.absY, rt.absZ);
        }
      } else if (params.camera.trackingMode === 'Free Orbit Overview') {
        const angle = elapsedTime * 0.06;
        const dist = maxOrbitDistance * 1.3;
        camera.position.set(Math.cos(angle) * dist, dist * 0.4, Math.sin(angle) * dist);
        camera.lookAt(0, 0, 0);
      } else if (params.camera.trackingMode === 'Static Origin View') {
        camera.position.set(0, maxOrbitDistance * 0.25, maxOrbitDistance * 1.1);
        camera.lookAt(0, 0, 0);
      } else if (params.camera.trackingMode === 'Manual Control') {
        controls.update();
      }

      if (selectionHelper) {
        scene.updateMatrixWorld();
        selectionHelper.update();
      }

      renderer.render(scene, camera);
    }

    // --- Resize Handler ---
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    animate();
  </script>
</body>
</html>
