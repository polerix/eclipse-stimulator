    // 8. Memory — "Computer, save current program." Local named saves, plus
    // a portable export/import code for taking a program to another browser.
    function createSaveProgramPanel(container, onSave) {
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader('MEM-01', 'Save Current Program');
      panel.appendChild(headerEl);

      const statusEl = el('div', 'tool-value tool-value--text', 'ENTER A NAME');
      panel.appendChild(statusEl);

      const row = el('div', 'tool-text-row');
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'tool-text-input';
      input.placeholder = 'Program name';
      input.maxLength = 40;
      input.setAttribute('aria-labelledby', titleId);
      row.appendChild(input);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-text-button';
      btn.textContent = 'Save';
      const submit = () => {
        playTick();
        const name = input.value.trim();
        if (!name) { statusEl.textContent = 'ENTER A NAME'; return; }
        onSave(name, statusEl, () => { input.value = ''; });
      };
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      row.appendChild(btn);

      panel.appendChild(row);
      container.appendChild(panel);
    }

    function createProgramListPanel(container) {
      const panel = el('div', 'lcars-panel');
      const { headerEl } = panelHeader('MEM-02', 'Stored Programs');
      panel.appendChild(headerEl);

      const list = el('div', 'tool-program-list');
      panel.appendChild(list);
      container.appendChild(panel);

      function refresh() {
        const programs = listPrograms();
        const names = Object.keys(programs).sort();
        list.innerHTML = '';
        if (names.length === 0) {
          list.appendChild(el('div', 'tool-program-empty', 'No programs stored'));
          return;
        }
        names.forEach(name => {
          const row = el('div', 'tool-program-row');
          row.appendChild(el('span', 'tool-program-name', name));

          const loadBtn = document.createElement('button');
          loadBtn.type = 'button';
          loadBtn.className = 'tool-program-load';
          loadBtn.textContent = 'Load';
          loadBtn.setAttribute('aria-label', 'Load saved program ' + name);
          // No playTick() here (or on Import) — loadProgram() reloads the
          // page immediately, cutting the blip off before it's audible.
          loadBtn.addEventListener('click', () => loadProgram(name));
          row.appendChild(loadBtn);

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'tool-program-delete';
          delBtn.textContent = '✕';
          delBtn.setAttribute('aria-label', 'Delete saved program ' + name);
          delBtn.addEventListener('click', () => {
            playTick();
            deleteProgram(name);
            refresh();
          });
          row.appendChild(delBtn);

          list.appendChild(row);
        });
      }

      refresh();
      return { refresh };
    }

    function createExportPanel(container) {
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader('MEM-03', 'Export Code');
      panel.appendChild(headerEl);

      const statusEl = el('div', 'tool-value tool-value--text', 'Generate a code to share');
      panel.appendChild(statusEl);

      const textarea = document.createElement('textarea');
      textarea.className = 'tool-textarea';
      textarea.readOnly = true;
      textarea.placeholder = 'Press Generate to create a shareable code…';
      textarea.setAttribute('aria-labelledby', titleId);
      panel.appendChild(textarea);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-text-button';
      btn.textContent = 'Generate + Copy';
      btn.addEventListener('click', () => {
        playTick();
        const code = exportProgramCode(snapshotParams());
        textarea.value = code;
        textarea.select();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code)
            .then(() => { statusEl.textContent = 'Copied to clipboard'; })
            .catch(() => { statusEl.textContent = 'Code ready — copy manually'; });
        } else {
          statusEl.textContent = 'Code ready — copy manually';
        }
      });
      panel.appendChild(btn);

      container.appendChild(panel);
    }

    function createImportPanel(container) {
      const panel = el('div', 'lcars-panel');
      const { headerEl, titleId } = panelHeader('MEM-04', 'Import Code');
      panel.appendChild(headerEl);

      const statusEl = el('div', 'tool-value tool-value--text', 'Paste a code below');
      panel.appendChild(statusEl);

      const textarea = document.createElement('textarea');
      textarea.className = 'tool-textarea';
      textarea.placeholder = 'Paste an exported code here…';
      textarea.setAttribute('aria-labelledby', titleId);
      panel.appendChild(textarea);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-text-button';
      btn.textContent = 'Import + Reload';
      btn.addEventListener('click', () => {
        const snapshot = importProgramFromCode(textarea.value);
        if (!snapshot) { statusEl.textContent = 'Invalid code'; return; }
        if (!safeLocalStorageSet(PENDING_LOAD_KEY, JSON.stringify(snapshot))) {
          statusEl.textContent = 'Storage unavailable';
          return;
        }
        location.reload();
      });
      panel.appendChild(btn);

      container.appendChild(panel);
    }

    createSaveProgramPanel(memoryTab, (name, statusEl, clearInput) => {
      const existed = Object.prototype.hasOwnProperty.call(listPrograms(), name);
      if (saveProgram(name)) {
        clearInput();
        programListPanel.refresh();
        statusEl.textContent = (existed ? 'Overwritten: ' : 'Saved: ') + name;
      } else {
        statusEl.textContent = 'Storage unavailable';
      }
    });
    const programListPanel = createProgramListPanel(memoryTab);
    createExportPanel(memoryTab);
    createImportPanel(memoryTab);

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      // Orbit Rotation
      orbitGroup.rotation.y += params.orbit.speed * delta;

      // Runner Motion along its configured path (start/end/nodes)
      if (params.runner.active && pathSampler && pathSampler.length > 0) {
        runnerProgress += params.runner.speed * delta * runnerDirection;

        if (params.runner.path.mode === 'Loop') {
          if (runnerProgress > pathSampler.length) runnerProgress -= pathSampler.length;
          else if (runnerProgress < 0) runnerProgress += pathSampler.length;
        } else if (params.runner.path.mode === 'Boomerang') {
          if (runnerProgress >= pathSampler.length) { runnerProgress = pathSampler.length; runnerDirection = -1; }
          else if (runnerProgress <= 0) { runnerProgress = 0; runnerDirection = 1; }
        } else { // Play Once
          if (runnerProgress >= pathSampler.length) {
            runnerProgress = pathSampler.length;
            params.runner.active = false;
            enableRunPanel.refresh(false);
          }
        }

        const pos = pathSampler.pointAt(runnerProgress);
        runnerGroup.position.copy(pos);

        // Face the direction of travel (flattened to the XZ plane) so
        // corners actually read as turns, not just an invisible path shape
        const lookAheadDist = clamp(runnerProgress + 0.5 * runnerDirection, 0, pathSampler.length);
        const ahead = pathSampler.pointAt(lookAheadDist);
        const dx = ahead.x - pos.x, dz = ahead.z - pos.z;
        if (dx * dx + dz * dz > 1e-6) {
          const len = Math.hypot(dx, dz);
          runnerForward.x = dx / len;
          runnerForward.z = dz / len;
          runnerGroup.lookAt(ahead.x, pos.y, ahead.z);
        }

        // Articulated leg swing (Rectifier shape only)
        if (runnerLegs) {
          const swing = Math.sin(elapsedTime * params.runner.speed * 1.5) * 0.6;
          runnerLegs.left.rotation.x = swing;
          runnerLegs.right.rotation.x = -swing;
        }
      }

      // Camera Positioning Modes
      if (params.camera.trackingMode === 'Runner Tracking') {
        // Chase camera: trail behind the runner along its actual heading
        const camX = runnerGroup.position.x - runnerForward.x * params.camera.distance;
        const camZ = runnerGroup.position.z - runnerForward.z * params.camera.distance;
        const camY = runnerGroup.position.y + params.camera.height;
        camera.position.set(camX, camY, camZ);
        camera.lookAt(runnerGroup.position.x, runnerGroup.position.y + 1, runnerGroup.position.z);
      } else if (params.camera.trackingMode === 'Free Orbit Overview') {
        const angle = elapsedTime * 0.1;
        const dist = params.orbit.radius * 2.2;
        camera.position.set(Math.cos(angle) * dist, 25, Math.sin(angle) * dist);
        camera.lookAt(0, 0, 0);
      } else if (params.camera.trackingMode === 'Static Origin View') {
        camera.position.set(0, 5, params.orbit.radius * 1.8);
        camera.lookAt(0, 0, 0);
      } else if (params.camera.trackingMode === 'Manual Control') {
        // Mouse-drag / touch-drag orbit, wheel / pinch zoom
        controls.update();
      }

      // Keep the selection outline glued to its (possibly moving) target
      if (selectionHelper) {
        scene.updateMatrixWorld();
        selectionHelper.update();
      }

      renderer.render(scene, camera);
    }

    // --- Resize Handler ---
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    animate();
  </script>
</body>
</html>
